<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Mini-Manager — Apprends l'argent en t'amusant !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
    background:linear-gradient(180deg,#dff1ff 0%,#f7fbf2 55%,#fff7e6 100%);
    min-height:100vh;color:#23415c;
  }
  .wrap{max-width:900px;margin:0 auto;padding:14px 16px 80px}

  /* ---- Bandeau de jauges ---- */
  .bandeau{
    display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:stretch;
    background:#fff;border-radius:26px;padding:14px 18px;
    box-shadow:0 8px 24px rgba(35,65,92,.10);position:sticky;top:10px;z-index:10;
  }
  .jauge{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
  .jauge .val{font-size:22px;font-weight:800;line-height:1.1}
  .jauge .lbl{font-size:12px;color:#7c95a8;font-weight:700}
  .jauge .rond{font-size:24px}
  .jauge.tirelire .val{color:#16a34a}
  .jauge.portefeuille .val{color:#0284c7}
  .mini-bar{width:100%;height:8px;background:#e6eef5;border-radius:99px;overflow:hidden;margin-top:3px}
  .mini-bar div{height:100%;background:linear-gradient(90deg,#22c55e,#86efac);border-radius:99px;transition:width .4s}
  .coeurs{font-size:17px;letter-spacing:2px;line-height:1.2}
  .jauge.joueurs{
    background:linear-gradient(135deg,#fbbf24,#fb923c);border:none;color:#fff;cursor:pointer;
    border-radius:18px;font-family:inherit;transition:.15s;padding:8px 14px
  }
  .jauge.joueurs:hover{filter:brightness(1.06);transform:scale(1.03)}
  .jauge.joueurs .lbl{color:#fff}

  /* ---- Carte situation ---- */
  .situation{
    background:#fff;border-radius:28px;margin-top:18px;padding:26px 26px 22px;
    box-shadow:0 10px 30px rgba(35,65,92,.10);text-align:center;position:relative;overflow:hidden;
  }
  .situation::before{content:"";position:absolute;top:-40px;right:-40px;width:130px;height:130px;
    border-radius:50%;background:rgba(56,189,248,.14)}
  .badge-semaine{display:inline-block;background:#38bdf8;color:#fff;font-weight:800;font-size:13px;
    border-radius:99px;padding:5px 16px;margin-bottom:12px}
  .emoji-situation{font-size:64px;line-height:1.2}
  .situation h2{font-size:clamp(19px,3.4vw,25px);font-weight:800;margin:10px 0 4px;color:#23415c}
  .situation .desc{color:#7c95a8;font-size:14px}

  .options{display:flex;flex-direction:column;gap:12px;margin-top:20px}
  .option{
    display:flex;align-items:center;gap:14px;text-align:left;width:100%;
    background:#f7fbf2;border:3px solid #e3f0e6;border-radius:20px;padding:14px 16px;
    cursor:pointer;font-family:inherit;transition:.15s;
  }
  .option:hover:not(:disabled){border-color:#fbbf24;background:#fffbef;transform:scale(1.01)}
  .option:disabled{opacity:.5;cursor:not-allowed}
  .option .o-ico{font-size:34px;flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    background:#fff;border-radius:16px;box-shadow:0 3px 10px rgba(35,65,92,.08)}
  .option .o-txt{flex:1;font-weight:700;font-size:15.5px;color:#23415c}
  .option .o-chips{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex:none}
  .chip{font-size:12.5px;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap}
  .chip.dep{background:#fee2e2;color:#dc2626}
  .chip.gain{background:#dcfce7;color:#16a34a}
  .chip.coeur-haut{background:#fce7f3;color:#db2777}
  .chip.coeur-bas{background:#f1f5f9;color:#64748b}
  .chip.manque{background:#ffedd5;color:#ea580c}

  /* ---- Actions rapides ---- */
  .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
  .action{
    background:#fff;border:3px solid transparent;border-radius:22px;padding:16px 12px;
    display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:14.5px;color:#23415c;
    box-shadow:0 6px 18px rgba(35,65,92,.09);transition:.15s;
  }
  .action:hover{transform:translateY(-3px)}
  .action .a-ico{font-size:30px}
  .action.tirelire-act{background:#ecfdf5;border-color:#a7f3d0}
  .action.magasin-act{background:#fef9ec;border-color:#fde68a}
  .action.semaine-act{background:#eff6ff;border-color:#bfdbfe}
  .action.objectif-act{background:#fdf2f8;border-color:#fbcfe8}
  .action:disabled{opacity:.5;cursor:not-allowed;transform:none}

  /* ---- Inventaire ---- */
  .inventaire{background:#fff;border-radius:22px;margin-top:18px;padding:16px 20px;box-shadow:0 6px 18px rgba(35,65,92,.08)}
  .inventaire h3{font-size:14px;color:#7c95a8;font-weight:800;letter-spacing:.5px}
  .inventaire .objets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:34px;align-items:center}
  .inventaire .objet{background:#f7fbf2;border:2px solid #e3f0e6;border-radius:14px;padding:5px 12px;font-size:20px}
  .inventaire .rien{color:#b0c4d2;font-size:13px}

  /* ---- Mascotte ---- */
  .mascotte{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    width:min(560px,94vw);background:#fff;border-radius:24px;padding:16px 18px;
    box-shadow:0 16px 50px rgba(35,65,92,.28);display:flex;gap:14px;align-items:flex-start;z-index:50;
    border:3px solid #fde68a;
  }
  .mascotte .bete{font-size:44px;flex:none;background:#fff7e6;border-radius:50%;width:70px;height:70px;
    display:flex;align-items:center;justify-content:center;border:3px solid #fde68a}
  .mascotte .bulle{flex:1}
  .mascotte .nom{font-size:12px;font-weight:800;color:#f59e0b;letter-spacing:.5px}
  .mascotte .message{font-size:14.5px;font-weight:600;color:#23415c;margin:2px 0 8px}
  .mascotte .impacts{display:flex;gap:6px;flex-wrap:wrap}
  .mascotte .btn-ok{
    background:linear-gradient(135deg,#fbbf24,#fb923c);color:#fff;border:none;border-radius:14px;
    padding:9px 22px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;width:100%;
  }

  /* ---- Tirelire / magasin modales ---- */
  .modale-fond{position:fixed;inset:0;background:rgba(20,40,60,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
  .modale{background:#fff;border-radius:26px;padding:24px;width:min(430px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modale h3{font-size:19px;margin-bottom:14px;color:#23415c}
  .liste-magasin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .article{display:flex;flex-direction:column;align-items:center;gap:4px;background:#f7fbf2;border:2px solid #e3f0e6;
    border-radius:18px;padding:12px;cursor:pointer;font-family:inherit;transition:.15s}
  .article:hover:not(:disabled){border-color:#fbbf24;background:#fffbef}
  .article:disabled{opacity:.45;cursor:not-allowed}
  .article .a-e{font-size:30px}
  .article .a-p{font-size:13px;font-weight:800;color:#0284c7}
  .transferts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  .transferts button{background:#ecfdf5;border:2px solid #a7f3d0;border-radius:16px;padding:12px 18px;
    font-family:inherit;font-weight:800;font-size:15px;color:#16a34a;cursor:pointer;transition:.15s}
  .transferts button:hover:not(:disabled){background:#d1fae5}
  .transferts button:disabled{opacity:.4;cursor:not-allowed}
  .btn-fermer{margin-top:14px;width:100%;background:#f1f5f9;border:none;border-radius:14px;padding:11px;
    font-family:inherit;font-weight:800;color:#23415c;cursor:pointer}

  /* ---- Bienvenue ---- */
  .bienvenue{max-width:460px;margin:60px auto 0;background:#fff;border-radius:30px;padding:36px 30px;text-align:center;
    box-shadow:0 16px 50px rgba(35,65,92,.14)}
  .bienvenue .mascotte-grande{font-size:70px}
  .bienvenue h1{font-size:26px;color:#23415c;margin:10px 0 6px}
  .bienvenue p{color:#7c95a8;font-size:14.5px;margin-bottom:20px}
  .bienvenue input{width:100%;background:#f7fbf2;border:3px solid #e3f0e6;border-radius:16px;padding:13px 16px;
    font-family:inherit;font-size:17px;font-weight:700;color:#23415c;text-align:center;outline:none}
  .bienvenue input:focus{border-color:#38bdf8}
  .bienvenue .objectifs-choix{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .bienvenue .objectifs-choix button{background:#ecfdf5;border:2px solid #a7f3d0;border-radius:16px;padding:10px 14px;
    font-family:inherit;font-weight:800;color:#16a34a;cursor:pointer;font-size:14px}
  .bienvenue .objectifs-choix button.choisi{background:#16a34a;color:#fff;border-color:#16a34a}
  .btn-partir{width:100%;margin-top:22px;background:linear-gradient(135deg,#fbbf24,#fb923c);color:#fff;border:none;
    border-radius:18px;padding:15px;font-family:inherit;font-size:18px;font-weight:800;cursor:pointer}

  /* ---- Confettis ---- */
  .confetti{position:fixed;top:-20px;z-index:100;font-size:22px;animation:tombe linear forwards}
  @keyframes tombe{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}

  .retour{position:fixed;top:12px;right:14px;background:#fff;border-radius:99px;padding:7px 15px;
    font-weight:800;font-size:13px;color:#23415c;text-decoration:none;box-shadow:0 4px 14px rgba(35,65,92,.12);z-index:30}
  #haut-page{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:55;width:48px;height:48px;
    border-radius:50%;background:linear-gradient(135deg,#7c68f7,#a98afc);color:#fff;border:none;
    font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(124,98,246,.4);
    display:none;align-items:center;justify-content:center;transition:.15s
  }
  #haut-page:hover{filter:brightness(1.12)}

  /* ---- Profils joueurs ---- */
  #haut-page:hover{filter:brightness(1.12)}
  .grid-profils{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}
  .profil-carte{
    background:#fff;border:3px solid #a7f3d0;border-radius:24px;padding:18px;text-align:center;
    box-shadow:0 8px 24px rgba(35,65,92,.10);position:relative
  }
  .p-avatar{font-size:42px;line-height:1.2}
  .p-nom{font-size:20px;font-weight:800;color:#23415c;margin:4px 0 6px}
  .p-stats{font-size:13px;color:#7c95a8;font-weight:700}
  .p-objectif{font-size:12.5px;color:#16a34a;font-weight:700;margin-top:2px}
  .btn-jouer{
    width:100%;margin-top:12px;background:linear-gradient(135deg,#fbbf24,#fb923c);color:#fff;border:none;
    border-radius:16px;padding:11px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer
  }
  .btn-jouer:hover{filter:brightness(1.06)}
  .p-liens{margin-top:10px;font-size:12.5px}
  .p-liens a{cursor:pointer;color:#0284c7;text-decoration:underline}
  .p-liens a:hover{color:#ea580c}
  .carte-ajout{border-style:dashed;cursor:pointer;transition:.15s}
  .carte-ajout:hover{transform:translateY(-3px);border-color:#fbbf24;background:#fffbef}
  @media(max-width:640px){ .bandeau{grid-template-columns:1fr 1fr} .jauge.bonheur{grid-column:1/-1;flex-direction:row;justify-content:center;gap:8px} }
</style>
</head>
<body>
<a class="retour" href="app.html">← Mon Budget</a>
<div class="wrap">
  <header class="bandeau">
    <div class="jauge portefeuille"><div class="val" id="j-porte">0 €</div><div><span class="rond">💰</span> <span class="lbl">Portefeuille</span></div></div>
    <div class="jauge tirelire"><div class="val" id="j-tirelire">0 €</div><div><span class="rond">🐷</span> <span class="lbl">Tirelire</span></div><div class="mini-bar"><div id="j-tirelire-bar" style="width:0%"></div></div></div>
    <div class="jauge bonheur"><div class="val coeurs" id="j-coeurs"></div><div><span class="rond" id="j-humeur">😄</span> <span class="lbl">Bonheur</span></div></div>
    <button class="jauge joueurs" id="btn-joueurs" title="Changer de joueur"><div class="rond">👥</div><div class="lbl" style="color:#fff">Joueurs</div></button>
  </header>

  <main id="contenu"></main>
</div>

<div id="zone-mascotte"></div>
<div id="zone-modale"></div>
<button id="haut-page" title="Retour en haut de page" style="display:none">⬆</button>

<script>
"use strict";

/* ============================== Scénarios ============================== */
const SCENARIOS = [
 {emoji:"🎂", titre:"C'est l'anniversaire de ton meilleur ami !", desc:"Dans une semaine, c'est la fête. Qu'est-ce que tu fais ?",
  opts:[
   {i:"🎁", t:"Acheter un gros cadeau", p:-15, h:3, m:"Généreux ! Ton ami va être super content… mais ton portefeuille a bien maigri. Pense à ta tirelire pour les prochaines fois."},
   {i:"✂️", t:"Fabriquer un cadeau toi-même", p:-2, h:2, m:"Bravo ! Un cadeau fait main vaut souvent plus qu'un cadeau cher. Et il te reste de l'argent pour ton projet !"},
   {i:"💌", t:"Une jolie carte maison", p:0, h:-1, m:"Une carte, c'est gentil… mais un peu léger pour son anniversaire. Il existe des cadeaux qui coûtent presque rien !"}]},
 {emoji:"🪙", titre:"Tu trouves un billet de 5 € par terre !", desc:"Personne ne t'a vu le ramasser. Que fais-tu ?",
  opts:[
   {i:"🙋", t:"Le rendre à son propriétaire", p:0, h:3, m:"Bravo ! Être honnête ne rapporte pas des euros… mais ça rapporte la fierté. Et ça, ça ne s'achète pas."},
   {i:"💰", t:"Le garder dans ton portefeuille", p:5, h:-1, m:"Tu as 5 € de plus… mais tu repenseras à ce billet. L'argent trouvé aux dépens de quelqu'un, ça pèse sur le cœur."},
   {i:"❤️", t:"Le donner à une bonne cause", p:0, h:2, m:"Généreux ! Tu as transformé un hasard en bon acte. Chapeau."}]},
 {emoji:"🎮", titre:"Le jeu vidéo dont tu rêvais est enfin sorti !", desc:"Tous tes copains en parlent depuis des mois.",
  opts:[
   {i:"🛒", t:"L'acheter tout de suite", p:-40, h:2, m:"Content ? Oui ! Mais voilà le piège : dépenser tout de suite, c'est souvent payer plus cher plus tard."},
   {i:"🐷", t:"Économiser dans ta tirelire", p:0, h:1, m:"Bien joué ! Chaque semaine épargnée te rapproche de ton jeu. La patience, c'est le super-pouvoir des grands épargnants."},
   {i:"👥", t:"Y jouer chez ton ami", p:0, h:1, m:"Malin ! Tester chez un ami avant d'acheter : le meilleur moyen de savoir si ça vaut le coup."}]},
 {emoji:"🚲", titre:"Ton vélo a une crevaison !", desc:"Et tu en as besoin pour aller à l'école…",
  opts:[
   {i:"🔧", t:"Le faire réparer correctement", p:-12, h:2, m:"Bien vu ! Entretenir ses affaires coûte toujours moins cher que de tout racheter."},
   {i:"🩹", t:"Un dépannage rapide", p:-3, h:0, m:"Dépanné pour aujourd'hui… mais prévois la vraie réparation, sinon ça reviendra plus cher."},
   {i:"🚶", t:"Marcher à pied", p:0, h:-2, m:"Économie réalisée… mais quelle fatigue ! Parfois, dépenser un peu évite de gros ennuis."}]},
 {emoji:"🎡", titre:"La fête foraine s'installe en ville !", desc:"Manèges, barbe à papa, lumières partout…",
  opts:[
   {i:"🎢", t:"Faire toutes les attractions", p:-12, h:4, m:"Quelle soirée ! Tu as transformé ton argent en souvenirs. Tant que c'est prévu dans ton budget, savoure !"},
   {i:"🎪", t:"Une seule attraction, bien choisie", p:-4, h:2, m:"Bien joué : choisir UNE chose qu'on aime vraiment, c'est ça, dépenser intelligemment."},
   {i:"🚶", t:"Juste flâner dans l'ambiance", p:0, h:1, m:"L'ambiance gratuitement, c'est possible ! Tes euros restent pour un projet plus grand."}]},
 {emoji:"🐶", titre:"Collecte pour le refuge des animaux", desc:"Des bénévoles collectent devant le magasin.",
  opts:[
   {i:"❤️", t:"Donner 5 €", p:-5, h:4, m:"Les animaux te remercient ! Donner, c'est transformer de l'argent en bonheur — et ça marche très bien."},
   {i:"🪙", t:"Donner 1 €", p:-1, h:2, m:"Même petit, ton geste compte. Un peu, c'est toujours mieux que rien."},
   {i:"🙈", t:"Ne rien donner", p:0, h:-1, m:"On ne peut pas tout donner, c'est vrai. Mais donne quand tu peux : ça fait du bien aussi à toi."}]},
 {emoji:"🧹", titre:"Ta chambre a besoin d'un GRAND rangement !", desc:"On ne voit plus le sol…",
  opts:[
   {i:"✨", t:"Grand rangement + aider tes parents", p:0, h:2, m:"Une chambre nette et des parents contents : le double bonus gratuit !"},
   {i:"🛏️", t:"Juste faire ton lit", p:0, h:1, m:"Petit pas aujourd'hui, grand rangement demain."},
   {i:"🙅", t:"Fermer la porte et oublier", p:0, h:-2, m:"La chambre t'attend toujours… et le désordre coûte du temps et du bonheur."}]},
 {emoji:"👟", titre:"Tes chaussures sont complètement usées !", desc:"Il va pleuvoir cette semaine…",
  opts:[
   {i:"⭐", t:"Des baskets de marque", p:-45, h:3, m:"Stylish ! Mais regarde : 45 €, c'est ton objectif qui s'envole. La marque, ça coûte cher."},
   {i:"✅", t:"Des baskets solides et confortables", p:-20, h:2, m:"Le choix du malin : confortable, solide, et ta tirelire respire."},
   {i:"⏳", t:"Attendre les soldes", p:0, h:-1, m:"La patience est une vertu… mais attention à tes pieds en attendant !"}]},
 {emoji:"🎬", titre:"Toute la classe va au cinéma !", desc:"Tu es invité, mais tu dois payer ta place.",
  opts:[
   {i:"🍿", t:"Place + pop-corn XL", p:-12, h:3, m:"Avec les copains ET le pop-corn : top ! Mais le pop-corn du cinéma coûte 3 fois son prix…"},
   {i:"🎟️", t:"Juste la place", p:-8, h:2, m:"L'essentiel : le film avec les copains. Le pop-corn peut attendre."},
   {i:"😔", t:"Rester à la maison", p:0, h:-2, m:"Économiser c'est bien… mais ne rate pas les moments avec tes amis pour quelques euros !"}]},
 {emoji:"🥤", titre:"Tu as très soif après le sport !", desc:"Le distributeur est juste là, tout près…",
  opts:[
   {i:"🥤", t:"Un soda au distributeur", p:-2, h:1, m:"2 € pour une canette… c'est le prix du confort. Les petites dépenses répétées sont les plus sournoises !"},
   {i:"💧", t:"Ta gourde d'eau maison", p:0, h:1, m:"CHAMPION ! Ta gourde te fait économiser des dizaines d'euros par an. C'est ça, les yeux ouverts."},
   {i:"🚰", t:"Ne rien boire", p:0, h:-2, m:"Économiser, oui — mais jamais sur ta santé !"}]},
 {emoji:"📱", titre:"L'écran de ton téléphone est fêlé !", desc:"Une petite fissure, mais elle grandit…",
  opts:[
   {i:"🔧", t:"Le faire réparer", p:-30, h:2, m:"Réparer avant que ça empire : la décision d'un vrai gestionnaire."},
   {i:"🛡️", t:"Mettre une protection d'écran", p:-6, h:1, m:"Mieux vaut prévenir : 6 € maintenant contre 30 € plus tard."},
   {i:"😅", t:"Continuer comme ça", p:0, h:-1, m:"Espérons que ça ne s'aggrave pas… les petites réparations évitent les grosses dépenses."}]},
 {emoji:"🤝", titre:"Tes parents te proposent un deal !", desc:"Ils ont besoin d'aide à la maison et sont prêts à te récompenser.",
  opts:[
   {i:"🧽", t:"Grand ménage du printemps contre 10 €", p:10, h:2, m:"Travailler pour gagner : l'argent mérité est le plus précieux de tous !"},
   {i:"📚", t:"Tenir tes notes pendant un mois contre 5 €", p:5, h:3, m:"L'école d'abord, et tu es récompensé pour la discipline. Double victoire !"},
   {i:"🛋️", t:"Refuser et rester tranquille", p:0, h:0, m:"Se reposer, c'est permis ! Mais l'argent mérité ne tombe pas du ciel."}]},


 {emoji:"💍", titre:"Anniversaire de mariage de tes parents !", desc:"25 ans, c'est rare et important.",
  opts:[
   {i:"🎉", t:"Organiser une surprise avec tes économies", p:-15, h:4, m:"Waouh ! Tu as utilisé ton épargne pour les personnes que tu aimes. Souvenir garanti pour eux… et pour toi."},
   {i:"🎨", t:"Un dessin et un poème", p:0, h:3, m:"Le meilleur des cadeaux : du temps et du cœur. Ils vont le garder toute leur vie !"},
   {i:"😶", t:"Ne rien faire de spécial", p:0, h:-1, m:"Un petit quelque chose fait toujours plus plaisir que rien."}]},










 {emoji:"🌡️", titre:"Tu te réveilles avec la gorge qui gratte…", desc:"L'école attend, mais tu ne te sens pas terrible.",

const POCHE_QUOTIDIENNE = 2;
const CARTES_PAR_JOUR = 30;
const MISSIONS_PAR_JOUR = 4;

const OBJECTIFS = [
 {o:"Cadeaux", c:50, e:"🎁"},
 {o:"Écouteurs", c:30, e:"🎧"},
 {o:"Skateboard", c:60, e:"🛹"},
 {o:"Nouveau vélo", c:80, e:"🚲"},
 {o:"Guitare", c:90, e:"🎸"},
 {o:"Console", c:120, e:"🎮"},
];

const AVATARS_JEU = ["🧒","👧","🦸","🧙","🤖","🦖"];

/* ============================== État ============================== */
const KEY_JEU = "miniManager.v2";
const escJ = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let MM = null;   // tous les profils joueurs
let J = null;    // le profil en train de jouer (raccourci)

function jeuDefaut(nom, avatar, objectifNom, objectifCible){
  const J = {
    v:1, nom, avatar,
    portefeuille: 15, tirelire: 0,
    objectif: {nom: objectifNom, cible: objectifCible},
    bonheur: 8,
    file: SCENARIOS.map((_,i)=>i).sort(() => Math.random() - 0.5),
    jour: todayJeu(), jourNumero: 1,
    cartesDuJour: [], cartesFaites: 0,
    missionsJour: [],
    inventaire: [], historique: []
  };
  tirerJournee(J);
  return J;
}
const todayJeu = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
};
function tirerJournee(J){
  if(!J.file || !J.file.length) J.file = SCENARIOS.map((_,i)=>i).sort(() => Math.random() - 0.5);
  J.cartesDuJour = J.file.splice(0, CARTES_PAR_JOUR);
  J.cartesFaites = 0;
  const melange = MISSIONS_POOL.slice().sort(() => Math.random() - 0.5);
  J.missionsJour = melange.slice(0, MISSIONS_PAR_JOUR).map(m => ({...m, faite:false}));
}
/* Nouvelle journée : argent de poche quotidien + nouvelles cartes et missions */
function nouveauJourSiBesoin(){
  const t = todayJeu();
  if(J.jour === t) return false;
  J.jour = t;
  J.jourNumero = (J.jourNumero || 1) + 1;
  J.portefeuille += POCHE_QUOTIDIENNE;
  if(!J.file || !J.file.length) J.file = SCENARIOS.map((_,i)=>i).sort(() => Math.random() - 0.5);
  J.cartesDuJour = J.file.splice(0, CARTES_PAR_JOUR);
  J.cartesFaites = 0;
  const melange = MISSIONS_POOL.slice().sort(() => Math.random() - 0.5);
  J.missionsJour = melange.slice(0, MISSIONS_PAR_JOUR).map(m => ({...m, faite:false}));
  J.historique.unshift({jour: J.jourNumero, txt: "💰 Argent de poche du jour : " + POCHE_QUOTIDIENNE + " €"});
  return true;
}
function jeuCharger(){
  try{
    const raw = localStorage.getItem(KEY_JEU);
    if(raw){ const p = JSON.parse(raw); if(p && p.profils) return p; }
  }catch(e){}
  try{
    const old = localStorage.getItem("miniManager.v1");
    if(old){
      const j = JSON.parse(old);
      if(j && j.nom){
        var id = "p" + Date.now();
        var profs = {};
        profs[id] = j;
        localStorage.removeItem("miniManager.v1");
        return {actif: id, profils: profs};
      }
    }
  }catch(e){}
  return {actif: null, profils: {}};
}
function jeuSauver(){
  try{
    MM.savedAt = Date.now();
    localStorage.setItem(KEY_JEU, JSON.stringify(MM));
  }catch(e){}
}

/* ============================== Affichage ============================== */
const $c = id => document.getElementById(id);
const fmtJ = n => Number(n).toLocaleString("fr-FR", {minimumFractionDigits: Number(n) % 1 ? 2 : 0, maximumFractionDigits: 2}) + " €";

function jauges(){
  $c("j-porte").textContent = fmtJ(J.portefeuille);
  $c("j-tirelire").textContent = fmtJ(J.tirelire);
  const cible = J.objectif ? J.objectif.cible : 80;
  $c("j-tirelire-bar").style.width = Math.min(100, cible>0 ? J.tirelire/cible*100 : 0) + "%";
  const pleines = Math.round(J.bonheur/2);
  $c("j-coeurs").textContent = "❤️".repeat(Math.max(0,pleines)) + "🤍".repeat(Math.max(0, 5-pleines));
  $c("j-humeur").textContent = J.bonheur>=8?"😄":J.bonheur>=6?"🙂":J.bonheur>=4?"😐":J.bonheur>=2?"😟":"😢";
}

function effetChips(o){
  let h = "";
  if(o.p) h += `<span class="chip ${o.p<0?"dep":"gain"}">${o.p<0?"−":"+"}${fmtJ(Math.abs(o.p))}</span>`;
  if(o.h) h += `<span class="chip ${o.h>0?"coeur-haut":"coeur-bas"}">${o.h>0?"❤️ +"+o.h:"💔 "+o.h}</span>`;
  return h;
}

function mascotte(msg, impacts, btnTxt, action){
  const zone = $c("zone-mascotte");
  zone.innerHTML = `<div class="mascotte">
    <div class="bete">🐿️</div>
    <div class="bulle">
      <div class="nom">NOISETTE L'ÉCUREUIL</div>
      <div class="message">${msg}</div>
      <div class="impacts">${impacts||""}</div>
      <button class="btn-ok" id="mascotte-ok">${btnTxt||"Continuer ➜"}</button>
    </div>
  </div>`;
  $c("mascotte-ok").onclick = () => { zone.innerHTML = ""; if(action) action(); };
}
function mascotteFermer(){ $c("zone-mascotte").innerHTML = ""; }

function confettis(){
  const emojis = ["🎉","✨","💚","💛","🪙","⭐"];
  for(let i=0;i<34;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.textContent = emojis[i % emojis.length];
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDuration = (1.6 + Math.random()*1.6) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3400);
  }
}

/* ============================== Écrans ============================== */

function ecranBienvenue(){
  $c("contenu").innerHTML = `
  <div class="bienvenue">
    <div class="mascotte-grande">🐿️</div>
    <h1>Bienvenue à Mini-Manager !</h1>
    <p>Je suis <b>Noisette</b>, l'écureuil gardien des tirelires.<br>Ensemble, on va apprendre à gérer ton argent… en t'amusant !</p>
    <input id="bienvenue-nom" placeholder="Comment tu t'appelles ?" maxlength="14">
    <p style="margin:18px 0 8px;font-weight:800;color:#16a34a">Pour quoi veux-tu économiser ? 🐷</p>
    <div class="objectifs-choix" id="objectifs-choix">
      ${OBJECTIFS.map(o=>`<button data-o="${o.o}" data-c="${o.c}">${o.e} ${o.o} · ${o.c} €</button>`).join("")}
    </div>
    <button class="btn-partir" id="bienvenue-partir" disabled>C'est parti ! ➜</button>
  </div>`;
  let choix = null;
  $c("objectifs-choix").addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    document.querySelectorAll("#objectifs-choix button").forEach(x => x.classList.remove("choisi"));
    b.classList.add("choisi"); choix = {nom: b.dataset.o, cible: +b.dataset.c};
    $c("bienvenue-partir").disabled = !$c("bienvenue-nom").value.trim() || !choix;
  });
  $c("bienvenue-nom").addEventListener("input", e => {
    $c("bienvenue-partir").disabled = !e.target.value.trim() || !choix;
  });
  $c("bienvenue-partir").onclick = () => {
    const nom = $c("bienvenue-nom").value.trim();
    if(!nom || !choix) return;
    J = jeuDefaut(nom, AVATARS_JEU[Math.floor(Math.random()*AVATARS_JEU.length)], choix.nom, choix.cible);
    jeuSauver();
    mascotte(`Super, ${nom} ! Voici tes <b>15 €</b> de départ. Dépense-les malin, épargne pour ton ${choix.nom.toLowerCase()}… et écoute mes conseils !`, null, "Jouer ➜", ecranJeu);
  };
}

function ecranJeu(){
  jauges();
  const cartesFini = J.cartesFaites >= J.cartesDuJour.length;
  const missionsFini = J.missionsJour.every(m=>m.faite);
  const jourFini = cartesFini && missionsFini;
  const objectif = J.objectif;
  const objTxt = objectif ? `${fmtJ(objectif.cible)} — ${objectif.nom}` : "—";

  let blocCarte;
  if(jourFini){
    const demain = new Date(Date.now() + 86400000).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
    blocCarte = `
      <span class="badge-semaine">Jour ${J.jourNumero} ✅ terminé</span>
      <div class="emoji-situation">🌟</div>
      <h2>Tu as tout terminé, ${J.nom} !</h2>
      <div class="desc">Aventure : <b>${J.cartesTotales||0} / ${SCENARIOS.length} cartes explorées</b>.<br>Noisette prépare <b>8 nouvelles cartes pour demain (${demain})</b>.<br><br>À demain ! 🐿️</div>`;
  } else if(cartesFini){
    blocCarte = `
      <span class="badge-semaine">✅ Cartes du jour terminées</span>
      <div class="emoji-situation">🎯</div>
      <h2>Il te reste tes missions !</h2>
      <div class="desc">Coche-les quand c'est fait, juste en dessous 👇</div>`;
  } else {
    const s = SCENARIOS[J.cartesDuJour[J.cartesFaites]];
    blocCarte = `
      <span class="badge-semaine">Carte ${J.cartesFaites+1} / ${J.cartesDuJour.length}</span>
      <div style="font-size:11.5px;color:#7c95a8;font-weight:700;margin-top:4px">Aventure : ${J.cartesTotales||0} / ${SCENARIOS.length} cartes explorées</div>
      <div class="emoji-situation">${s.emoji}</div>
      <h2>${s.titre}</h2>
      <div class="desc">${s.desc}</div>
      <div class="options">
        ${s.opts.map((o,i)=>{
          const manque = o.p < 0 && J.portefeuille < Math.abs(o.p);
          return `<button class="option" data-choix="${i}" ${manque?"disabled":""}>
            <span class="o-ico">${o.i}</span>
            <span class="o-txt">${o.t}${manque?`<div class="chip manque" style="margin-top:4px">💸 Il te manque ${fmtJ(Math.abs(o.p)-J.portefeuille)}</div>`:""}</span>
            <span class="o-chips">${effetChips(o)}</span>
          </button>`;
        }).join("")}
      </div>`;
  }

  const missionsHtml = J.missionsJour.map((m,i)=>{
    const gains = `${m.e2>0 ? "+"+m.e2+" €" : ""}${m.h>0 ? (m.e2>0?" · ":"") + "❤️ +"+m.h : ""}`;
    return `<div class="fam-mission${m.faite?" fait":""}">
      <span class="fam-mission-nom">${m.e} ${m.n}</span>
      <span class="fam-mission-prix" style="color:#16a34a">${gains}</span>
      ${m.faite ? `<span class="badge ok" style="margin-left:auto">✓</span>` : `<button class="btn btn-grad btn-sm" data-mission-jour="${i}" style="margin-left:auto;padding:5px 12px">Fait !</button>`}
    </div>`;
  }).join("");

  $c("contenu").innerHTML = `
  <section class="situation">${blocCarte}</section>

  <div class="actions">
    <button class="action tirelire-act" data-action-jeu="tirelire"><span class="a-ico">🏦</span>Ma tirelire<div style="font-size:11.5px;color:#7c95a8;font-weight:700">Objectif : ${objTxt}</div></button>
    <button class="action magasin-act" data-action-jeu="magasin"><span class="a-ico">🛒</span>Le magasin<div style="font-size:11.5px;color:#7c95a8;font-weight:700">Dépenser un peu</div></button>
    <button class="action objectif-act" data-action-jeu="objectif"><span class="a-ico">🎯</span>Mon objectif<div style="font-size:11.5px;color:#7c95a8;font-weight:700">${objectif?escJ(objectif.nom):"à choisir"}</div></button>
  </div>

  <div class="inventaire">
    <h3>✅ MISSIONS DU JOUR (${J.missionsJour.filter(m=>m.faite).length}/${J.missionsJour.length})</h3>
    ${missionsHtml}
  </div>

  <div class="inventaire">
    <h3>🎒 TES AFFAIRES</h3>
    <div class="objets">${(J.inventaire||[]).map(x=>`<span class="objet">${x}</span>`).join("") || `<span class="rien">Achète des choses au magasin et elles apparaîtront ici !</span>`}</div>
  </div>

  <div class="inventaire" style="margin-top:12px">
    <h3>📖 TON HISTOIRE</h3>
    <div style="margin-top:8px">${(J.historique||[]).slice(0,6).map(h=>`<div style="display:flex;gap:8px;padding:4px 0;font-size:13.5px;color:#7c95a8"><b style="color:#23415c">Jour ${h.jour||h.sem||"1"}</b> ${h.txt}</div>`).join("") || `<span class="rien">Ta grande aventure commence…</span>`}</div>
  </div>`;
}

/* ============================== Actions du jeu ============================== */

function choisirOption(i){
  const s = SCENARIOS[J.cartesDuJour[J.cartesFaites]];
  const o = s.opts[i];
  if(o.p < 0 && J.portefeuille < Math.abs(o.p)) return;
  J.portefeuille = Math.max(0, Math.round((J.portefeuille + o.p)*100)/100);
  J.bonheur = Math.max(0, Math.min(10, J.bonheur + o.h));
  if(o.tirelire) J.tirelire += o.tirelire;
  J.cartesFaites++;
  J.cartesTotales = (J.cartesTotales||0) + 1;
  J.historique.unshift({jour: J.jourNumero, txt: `${o.i} ${s.titre} — ${o.t}`});
  if(J.historique.length > 40) J.historique.length = 40;
  jeuSauver(); jauges();
  const cartesFini = J.cartesFaites >= J.cartesDuJour.length;
  const missionsFini = J.missionsJour.every(m=>m.faite);
  if(cartesFini && missionsFini){
    confettis();
    mascotte(o.m + "<br><br><b>🌟 TU AS TOUT TERMINÉ POUR AUJOURD'HUI !</b><br>Noisette prépare de nouvelles cartes et missions pour demain. Dors bien…", effetChips(o), "À demain 💤", ecranJeu);
    return;
  }
  if(cartesFini){
    mascotte(o.m + "<br><br>✅ C'était ta dernière carte du jour ! Il te reste <b>des missions à cocher</b> juste en dessous.", effetChips(o), "Voir mes missions ➜", ecranJeu);
    return;
  }
  mascotte(o.m, effetChips(o), "Continuer ➜", ecranJeu);
}

function ouvrirTirelire(){
  const o = J.objectif;
  $c("zone-modale").innerHTML = `<div class="modale-fond" id="fond-modale"><div class="modale">
    <h3>🏦 Ma tirelire : ${fmtJ(J.tirelire)}</h3>
    <p style="color:#7c95a8;font-size:13.5px;margin-bottom:12px">Objectif : <b>${o ? o.nom : "aucun"}</b> ${o ? `— ${fmtJ(o.epargne||0)} mis de côté sur ${fmtJ(o.cible)}` : ""}</p>
    <div class="transferts">
      <button data-trans="1">Mettre 1 €</button>
      <button data-trans="5">Mettre 5 €</button>
      <button data-trans="all">Mettre tout (${fmtJ(J.portefeuille)})</button>
    </div>
    ${o && o.epargne >= o.cible ? `<button class="btn-partir" style="margin-top:16px" data-acheter="1">🎉 Acheter ton ${o.nom} !</button>` : ""}
    <button class="btn-fermer" data-fermer="1">Fermer</button>
  </div></div>`;
  document.querySelectorAll("[data-trans]").forEach(b => b.onclick = () => {
    const montant = b.dataset.trans === "all" ? J.portefeuille : +b.dataset.trans;
    if(!o){ toastJeu("Choisis d'abord un objectif !"); return; }
    if(montant <= 0){ toastJeu("Ton portefeuille est vide…"); return; }
    const real = Math.min(montant, J.portefeuille);
    J.portefeuille -= real; J.tirelire += real;
    jeuSauver(); jauges(); fermerModale(); ouvrirTirelire();
  });
  const ach = document.querySelector("[data-acheter]");
  if(ach) ach.onclick = () => {
    confettis();
    J.objectif = null; J.tirelire = 0;
    jeuSauver(); fermerModale();
    mascotte(`INCROYABLE, ${J.nom} ! Tu as économisé et réalisé ton projet ! 🎉 Tu peux en être très fier — et choisir un nouveau défi quand tu veux !`, null, "Nouveau défi ➜", ecranJeu);
  };
  attacherFermer();
}
function ouvrirMagasin(){
  $c("zone-modale").innerHTML = `<div class="modale-fond" id="fond-modale"><div class="modale">
    <h3>🛒 Le magasin</h3>
    <div class="liste-magasin">
      ${BOUTIQUE.map((a,i)=>`<button class="article" data-article="${i}" ${J.portefeuille < a.p ? "disabled":""}>
        <span class="a-e">${a.e}</span><b>${a.n}</b><span class="a-p">${fmtJ(a.p)} · ❤️ +${a.h}</span>
      </button>`).join("")}
    </div>
    <p style="color:#7c95a8;font-size:12.5px;margin-top:10px">Chaque achat te rend un peu plus heureux… mais vide ton portefeuille. À toi de choisir !</p>
    <button class="btn-fermer" data-fermer="1">Fermer</button>
  </div></div>`;
  document.querySelectorAll("[data-article]").forEach(b => b.onclick = () => {
    const a = BOUTIQUE[+b.dataset.article];
    if(J.portefeuille < a.p) return;
    J.portefeuille -= a.p;
    J.bonheur = Math.min(10, J.bonheur + a.h);
    J.inventaire = J.inventaire || [];
    J.inventaire.unshift(a.e);
    jeuSauver(); jauges(); fermerModale(); ouvrirMagasin();
  });
  attacherFermer();
}
function toastJeu(msg){
  mascotte(msg, null, "OK !", null);
}
function fermerModale(){ $c("zone-modale").innerHTML = ""; }
function attacherFermer(){
  const f = document.querySelector("[data-fermer]");
  if(f) f.onclick = () => { fermerModale(); ecranJeu(); };
  document.getElementById("fond-modale").addEventListener("click", e => { if(e.target.id === "fond-modale"){ fermerModale(); ecranJeu(); } });
}

    <h3>🎯 Changer d'objectif d'épargne</h3>
    <p style="color:#7c95a8;font-size:13.5px;margin-bottom:12px">Pour quoi veux-tu économiser maintenant ?</p>

  });
  attacherFermer();
}

    <h3>➕ Nouveau joueur</h3>
    <input id="nv-nom" placeholder="Comment tu t'appelles ?" maxlength="14" style="width:100%;background:#f7fbf2;border:3px solid #e3f0e6;border-radius:16px;padding:12px 14px;font-family:inherit;font-size:17px;font-weight:700;color:#23415c;text-align:center;outline:none">
    <p style="margin:16px 0 8px;font-weight:800;color:#23415c;text-align:center;font-size:14px">Choisis ton avatar</p>
    <div id="nv-avatars" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      ${AVATARS_JEU.map(a=>`<button data-avatar="${a}" style="font-size:26px;width:52px;height:52px;border-radius:50%;border:3px solid #e3f0e6;background:#f7fbf2;cursor:pointer">${a}</button>`).join("")}
    </div>
    <p style="margin:16px 0 8px;font-weight:800;color:#16a34a;text-align:center;font-size:14px">Pour quoi veux-tu économiser ? 🐷</p>
    <div id="nv-objectifs" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      ${OBJECTIFS.map(o=>`<button data-o="${o.o}" data-c="${o.c}" style="background:#ecfdf5;border:2px solid #a7f3d0;border-radius:14px;padding:9px 12px;font-family:inherit;font-weight:800;color:#16a34a;cursor:pointer;font-size:13px">${o.e} ${o.o} · ${o.c} €</button>`).join("")}
    </div>
    <button class="btn-partir" id="nv-go" style="margin-top:18px">C'est parti ! ➜</button>
    <button class="btn-fermer" data-fermer="1">Annuler</button>
  </div></div>`;

  var avatarChoisi = null, objChoisi = null;
  $c("nv-avatars").addEventListener("click", function(e){
    var b = e.target.closest("[data-avatar]"); if(!b) return;
    document.querySelectorAll("#nv-avatars button").forEach(function(x){ x.style.borderColor = "#e3f0e6"; x.style.background = "#f7fbf2"; });
    b.style.borderColor = "#fbbf24"; b.style.background = "#fffbef";
    avatarChoisi = b.dataset.avatar;
  });
  $c("nv-objectifs").addEventListener("click", function(e){
    var b = e.target.closest("[data-o]"); if(!b) return;
    document.querySelectorAll("#nv-objectifs button").forEach(function(x){ x.style.borderColor = "#a7f3d0"; x.style.background = "#ecfdf5"; x.style.color = "#16a34a"; });
    b.style.borderColor = "#fbbf24"; b.style.background = "#fffbef";
    objChoisi = {nom: b.dataset.o, cible: +b.dataset.c};
  });
  $c("nv-nom").addEventListener("input", function(){});
  $c("nv-go").onclick = function(){
    var nom = $c("nv-nom").value.trim();
    var reouvrir = function(){
      ouvrirNouveauJoueur();
      document.getElementById("nv-nom").value = nom;
    };
    fermerModale();
    if(!nom){
      mascotte("Comment tu t'appelles ? Écris ton prénom dans la case ! ✏️", null, "OK !", reouvrir);
      return;
    }
    if(!avatarChoisi){
      mascotte("Choisis ton avatar — le petit personnage qui te représente ! 🦊🐼🐸", null, "OK !", reouvrir);
      return;
    }
    if(!objChoisi){
      mascotte("Choisis ton objectif : pour quoi veux-tu économiser ? 🐷", null, "OK !", reouvrir);
      return;
    }
    var id = "p" + Date.now();
    MM.profils[id] = jeuDefaut(nom, avatarChoisi, objChoisi.nom, objChoisi.cible);
    MM.actif = id; J = MM.profils[id];
    jeuSauver();
    mascotte(`Super, ${nom} ! Voici tes <b>15 €</b> de départ. Dépense-les malin, épargne pour ton ${objChoisi.nom.toLowerCase()}… et écoute mes conseils !`, null, "Jouer ➜", ecranJeu);
  };
  var f = document.querySelector("[data-fermer]");
  if(f) f.onclick = function(){ fermerModale(); ecranProfils(); };
}

function semaineSuivante(){ /* remplacée par le système de jours */ }

/* ============================== Démarrage ============================== */
MM = jeuCharger();
if(MM.actif && MM.profils[MM.actif]){
  J = MM.profils[MM.actif];
  nouveauJourSiBesoin();
  jeuSauver();
  ecranJeu();
} else {
  J = null;
  ecranProfils();
}

document.body.addEventListener("click", e => {
  const mj = e.target.closest("[data-mission-jour]");
  if(mj){
    const i = +mj.dataset.missionJour;
    const m = J.missionsJour[i];
    if(!m || m.faite) return;
    m.faite = true;
    J.portefeuille += m.e2;
    J.bonheur = Math.min(10, J.bonheur + m.h);
    jeuSauver(); jauges();
    const cartesFini = J.cartesFaites >= J.cartesDuJour.length;
    if(cartesFini && J.missionsJour.every(x=>x.faite)){
      confettis();
      mascotte("TU AS TOUT TERMINÉ POUR AUJOURD'HUI ! 🌟 Noisette prépare de nouvelles cartes et missions pour demain. Dors bien… et à demain !", null, "À demain 💤", ecranJeu);
      return;
    }
    ecranJeu();
    return;
  }
  const nj = e.target.closest("[data-nouveau-joueur]");
  if(nj){ ouvrirNouveauJoueur(); return; }
  const rp = e.target.closest("[data-jouer]");
  if(rp){
    MM.actif = rp.dataset.jouer;
    J = MM.profils[MM.actif];
    nouveauJourSiBesoin();
    jeuSauver(); ecranJeu();
    return;
  }
  const rst = e.target.closest("[data-reset-prof]");
  if(rst){
    var idR = rst.dataset.resetProf;
    var pr = MM.profils[idR];
    if(pr && confirm("Réinitialiser la partie de " + pr.nom + " ?\n\nSon argent, sa tirelire et ses objectifs reviennent au début (son prénom est conservé).")){
      MM.profils[idR] = jeuDefaut(pr.nom, pr.avatar, pr.objectif ? pr.objectif.nom : "Cadeaux", pr.objectif ? pr.objectif.cible : 50);
      if(MM.actif === idR) J = MM.profils[idR];
      jeuSauver(); ecranProfils();
      toastJeu("Partie réinitialisée !");
    }
    return;
  }
  const dp = e.target.closest("[data-del-prof]");
  if(dp){
    var idD = dp.dataset.delProf;
    var nomD = MM.profils[idD] ? MM.profils[idD].nom : "ce joueur";
    if(confirm("Supprimer le joueur « " + nomD + " » et sa tirelire ?")){ 
      delete MM.profils[idD];
      if(MM.actif === idD){ MM.actif = null; J = null; }
      jeuSauver(); ecranProfils();
      toastJeu("Joueur supprimé.");
    }
    return;
  }
  const o = e.target.closest("[data-choix]");
  if(o){ choisirOption(+o.dataset.choix); return; }
  const a = e.target.closest("[data-action-jeu]");
  if(a){
    const k = a.dataset.actionJeu;
    if(k === "tirelire") ouvrirTirelire();
    else if(k === "magasin") ouvrirMagasin();
    else if(k === "objectif") ouvrirObjectif();
    else if(k === "reset"){
      if(confirm("Recommencer la partie de " + J.nom + " à zéro ?\n\nSon argent, sa tirelire et ses objectifs reviennent au début (son prénom est conservé).")){
        J = jeuDefaut(J.nom, J.avatar, J.objectif ? J.objectif.nom : "Cadeaux", J.objectif ? J.objectif.cible : 50);
        MM.profils[MM.actif] = J;
        jeuSauver(); ecranJeu();
        toastJeu("Nouvelle partie, nouveau départ !");
      }
    }
    return;
  }
});

if(J && MM.actif){ ecranJeu(); } else { ecranProfils(); }

/* Synchronisation multi-onglets du jeu */
function syncJeuOnglets(){
  try{
    if(!MM) return;
    var raw = localStorage.getItem(KEY_JEU);
    if(!raw) return;
    var autre = JSON.parse(raw);
    var autreAt = (autre && autre.savedAt) || 0;
    var moiAt = (MM && MM.savedAt) || 0;
    if(autreAt > moiAt){
      MM = autre;
      if(MM.actif && MM.profils[MM.actif]){ J = MM.profils[MM.actif]; nouveauJourSiBesoin(); }
      else { J = null; }
      ecranJeu();
    }
  }catch(e){}
}
window.addEventListener("focus", syncJeuOnglets);

document.getElementById("btn-joueurs").addEventListener("click", ecranProfils);

/* Bouton retour en haut (visible sur les pages longues) */
function majHautPageJeu(){
  var hp = document.getElementById("haut-page");
  if(hp) hp.style.display = window.scrollY > 350 ? "flex" : "none";
}
window.addEventListener("scroll", majHautPageJeu, {passive:true});
document.getElementById("haut-page").addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
majHautPageJeu();
</script>
