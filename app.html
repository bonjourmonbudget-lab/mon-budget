/* ============================== Calculatrice du tableau de bord ============================== */

function calcCard(){
  const rangees = [["7","8","9","÷"],["4","5","6","×"],["1","2","3","−"]];
  const expr = String(UI.calc.expr || "0");
  return `<div class="card" id="calc-card" style="padding:16px">
    <div id="calc-disp" style="text-align:right;font-size:22px;font-weight:800;min-height:32px;padding:8px 12px;background:var(--input-bg);border-radius:10px;overflow:hidden;white-space:nowrap">${esc(expr.replace(/\./g,","))}</div>
    <div class="calc-grid">
      ${rangees.flat().map(k=>`<button class="calc-key" data-calc="${k}">${k}</button>`).join("")}
      <button class="calc-key" data-calc="0">0</button>
      <button class="calc-key" data-calc=",">,</button>
      <button class="calc-key calc-c" data-calc="C">C</button>
      <button class="calc-key" data-calc="+">+</button>
      <button class="calc-key" data-calc="⌫" style="grid-column:span 2">⌫ Effacer</button>
      <button class="calc-key calc-eq" data-calc="=" style="grid-column:span 2">=</button>
    </div>
    <button class="calc-reset" data-calc="C" title="Efface tout le calcul en cours (touche Suppr ou Échap)">⭯ Réinitialiser tout</button>
    <p style="color:var(--muted-2);font-size:11.5px;margin-top:10px;text-align:center">🧮 Utilisable au clavier : chiffres, + − × ÷, Entrée =, Retour arrière, Suppr = Reset</p>
  </div>`;
}

function handleCalcKey(k){
  if(!UI.calc) UI.calc = {visible:false, expr:"0"};
  let ex = String(UI.calc.expr || "0");
  if(k === "C"){
    ex = "0";
  } else if(k === "⌫"){
    ex = ex.length > 1 ? ex.slice(0, -1) : "0";
  } else if(k === "="){
    try{
      if(!/^[\d+\-*/().]+$/.test(ex)) throw new Error("x");
      const v = Function('"use strict"; return (' + ex + ")")();
      if(typeof v !== "number" || !isFinite(v)) throw new Error("x");
      ex = String(Math.round(v * 100) / 100);
    }catch(err){ ex = "Erreur"; }
  } else if("0123456789".includes(k)){
    const dernier = ex.slice(-1);
    ex = (ex === "Erreur" || ex === "0") ? k : ex + k;
    if(dernier === "0" && ex === "00") ex = "0";
  } else if(k === ","){
    const nombreEnCours = ex.match(/[\d.]*$/)[0];
    if(!nombreEnCours.includes(".")) ex += ".";
  } else {
    if(ex === "Erreur") return;
    const ops = {"÷":"/","×":"*","−":"-","+":"+"};
    ex += ops[k];
  }
  UI.calc.expr = ex;
  const disp = document.getElementById("calc-disp");
  if(disp) disp.textContent = ex.replace(/\./g, ",");
}

/* Clavier physique → calculatrice (quand elle est ouverte) */
document.addEventListener("keydown", (e) => {
  if(!UI.calc || !UI.calc.visible || UI.tab !== "dash") return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea" || tag === "select") return;
  let k = null;
  if(/^[0-9]$/.test(e.key)) k = e.key;
  else if(e.key === "," || e.key === ".") k = ",";
  else if(e.key === "+") k = "+";
  else if(e.key === "-") k = "−";
  else if(e.key === "*") k = "×";
  else if(e.key === "/") k = "÷";
  else if(e.key === "Enter") k = "=";
  else if(e.key === "Backspace") k = "⌫";
  else if(e.key === "Escape" || e.key === "Delete") k = "C";
  if(!k) return;
  e.preventDefault();
  handleCalcKey(k);
  const btn = document.querySelector('[data-calc="' + k + '"]');
  if(btn){ btn.classList.add("calc-flash"); setTimeout(() => btn.classList.remove("calc-flash"), 130); }
});

/* ============================== Export / Import ============================== */

function download(filename, content, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* Export avec boîte de dialogue « Enregistrer sous » :
   choix de l'emplacement + écrasement de l'ancienne sauvegarde possible.
   Repli automatique sur le téléchargement classique si le navigateur ne gère pas. */
async function exportFichier(nomSuggere, contenu, mime, ext, messageOk){
  if(window.showSaveFilePicker){
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: nomSuggere,
        types: [{description: "Mon Budget", accept: {[mime]: ["." + ext]}}]
      });
      const w = await handle.createWritable();
      await w.write(contenu);
      await w.close();
      toast(messageOk + " ✓");
      return;
    }catch(e){
      if(e && e.name === "AbortError") return; // l'utilisateur a annulé
      // autre erreur : repli sur le téléchargement classique
    }
  }
  download(nomSuggere, contenu, mime + (mime === "text/csv" ? ";charset=utf-8" : ""));
  toast(messageOk + " — fichier placé dans vos Téléchargements.");
}

async function exportCsv(){
  const head = "Date;Libellé;Catégorie;Montant (€)";
  const lines = S.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date))
    .map(t=>`${t.date};${String(t.label).replace(/;/g,",")};${catOf(t.cat).label};${String(t.montant).replace(".",",")}`);
  await exportFichier("mon-budget-transactions.csv", "\uFEFF" + head + "\n" + lines.join("\n"), "text/csv", "csv", "Export CSV enregistré");
}

document.getElementById("nav").addEventListener("click", e=>{

document.getElementById("app").addEventListener("click", async e=>{
  const ckey = e.target.closest("[data-calc]");
  if(ckey){ handleCalcKey(ckey.dataset.calc); return; }
  const el = e.target.closest("[data-action]");
  if(!el){
    const link = e.target.closest("[data-action],a[data-tab]");
    return;
  }
  const a = el.dataset.action;
  if(a==="goto"){ UI.tab = el.dataset.tab; render(); }
  else if(a==="goto-add"){ UI.tab = "tx"; render(); setTimeout(()=>document.getElementById("tx-label")?.focus(), 60); }
  else if(a==="month-prev"){ UI.month = shiftMonth(UI.month,-1); render(); }
  else if(a==="month-next"){ UI.month = shiftMonth(UI.month, 1); render(); }
  else if(a==="period"){ UI.period = +el.dataset.n || 6; render(); }
  else if(a==="del-tx"){
    S.transactions = S.transactions.filter(t=>t.id!==el.dataset.id);
    save(); render(); toast("Transaction supprimée.");
  }
  else if(a==="add-charge"){
    S.settings.chargesFixes.push({id:uid(), label:"", montant:0, cat:"autre"});
    save(); render();
  }
  else if(a==="add-revenu"){
    S.settings.revenus.push({id:uid(), label:"", montant:0});
    save(); render();
  }
  else if(a==="del-revenu"){
    S.settings.revenus = S.settings.revenus.filter(r=>r.id!==el.dataset.id);
    save(); render(); toast("Revenu supprimé.");
  }
  else if(a==="del-charge"){
    S.settings.chargesFixes = S.settings.chargesFixes.filter(c=>c.id!==el.dataset.id);
    save(); render(); toast("Charge fixe supprimée.");
  }
  else if(a==="suggest-budgets"){
    if(!confirm("Générer de nouvelles enveloppes ?\n\nCela REMPLACERA vos enveloppes variables actuelles (charges fixes et épargne conservées).")) return;
    const pool = Math.max(0, revenuTotal() - chargesTotal() - S.settings.objectif);
    const w = {alimentation:.45, transport:.13, loisirs:.12, restaurants:.09, sante:.06, shopping:.10, autre:.05};
    for(const [id,share] of Object.entries(w)) S.budgets[id] = Math.round(pool*share/5)*5;
    S.budgets.epargne = S.settings.objectif;
    save(); render(); toast("Enveloppes générées à partir de votre revenu.");
  }
  else if(a==="add-env"){
    const inp = document.getElementById("new-env-name");
    const name = (inp && inp.value || "").trim();
    if(!name){ toast("Saisissez un nom d'enveloppe."); if(inp) inp.focus(); return; }
    if(cats().some(c=>c.label.toLowerCase()===name.toLowerCase())){ toast("Cette enveloppe existe déjà."); return; }
    const palette = ["#a78bfa","#60a5fa","#f472b6","#34d399","#fbbf24","#22d3ee","#e879f9","#fb923c"];
    const id = slugId(name);
    S.cats = cats().concat([{id, label:name, color:palette[cats().length % palette.length], bucket:"envies", custom:true}]);
    S.budgets[id] = 0;
    save(); render(); toast(`Enveloppe « ${name} » ajoutée — définissez son montant.`);
  }
  else if(a==="del-env"){
    const id = el.dataset.id;
    S.cats = cats().filter(c=>c.id!==id);
    delete S.budgets[id];
    S.transactions.forEach(t=>{ if(t.cat===id) t.cat = "autre"; });
    save(); render(); toast("Enveloppe supprimée — ses transactions sont passées dans « Autre ».");
  }
  else if(a==="import-open"){ const f = document.getElementById("import-bank"); if(f) f.click(); }
  else if(a==="import-cancel"){ UI.import = null; render(); }
  else if(a==="import-confirm"){
    const rows = buildImportRows();
    const toAdd = rows.filter(r=>r.valid && !r.dup && r.cat!=="__ignore__");
    if(!toAdd.length){ toast("Rien à importer — vérifiez l'aperçu."); return; }
    for(const r of toAdd) S.transactions.push({id:uid(), date:r.date, label:r.label, montant:r.montant, cat:r.cat});
    save(); UI.import = null; UI.txMonth = "all"; render();
    toast(toAdd.length + " ligne(s) importée(s) dans vos transactions.");
  }
  else if(a==="add-rule"){
    const inp = document.getElementById("new-rule-mot");
    const mot = (inp && inp.value || "").trim();
    if(!mot){ toast("Saisissez un mot-clé."); if(inp) inp.focus(); return; }
    const cat = document.getElementById("new-rule-cat").value;
    S.rules.push({id:uid(), mot, cat});
    save(); render(); toast(`Règle « ${mot} » ajoutée.`);
  }
  else if(a==="del-rule"){
    S.rules = S.rules.filter(r=>r.id!==el.dataset.id);
    save(); render(); toast("Règle supprimée.");
  }
  else if(a==="goal-add"){
    const nom = (document.getElementById("new-goal-nom").value||"").trim();
    const cible = parseAmount(document.getElementById("new-goal-cible").value);
    if(!nom){ toast("Donnez un nom à votre objectif."); return; }
    if(!cible || cible<=0){ toast("Saisissez une cible en euros."); return; }
    const echeance = document.getElementById("new-goal-ech").value || "";
    S.goals.push({id:uid(), nom, cible, echeance, epargne:0});
    save(); render(); toast(`Objectif « ${nom} » créé — attribuez-lui de l'épargne.`);
  }
  else if(a==="goal-unfund"){
    // Fonds d'urgence : id spécial __fu__
    if(el.dataset.id === "__fu__"){
      const amtU = parseAmount(document.getElementById("goal-in-__fu__")?.value);
      if(!amtU || amtU<=0){ toast("Saisissez un montant à reprendre."); return; }
      const realU = Math.min(amtU, (+S.fuEpargne||0));
      if(realU<=0){ toast("Le fonds d'urgence est à 0 € — rien à reprendre."); return; }
      S.fuEpargne = (+S.fuEpargne||0) - realU;
      save(); render(); toast(fmt0.format(realU) + " repris du fonds d'urgence → retournés au pot non alloué.");
      return;
    }
    const gU = S.goals.find(x=>x.id===el.dataset.id);
    if(!gU) return;
    const amtG = parseAmount(document.getElementById("goal-in-"+el.dataset.id)?.value);
    if(!amtG || amtG<=0){ toast("Saisissez un montant à reprendre."); return; }
    const realG = Math.min(amtG, (+gU.epargne||0));
    if(realG<=0){ toast("« " + gU.nom + " » est à 0 € — rien à reprendre."); return; }
    gU.epargne = (+gU.epargne||0) - realG;
    save(); render(); toast(fmt0.format(realG) + " repris de « " + gU.nom + " » → retournés au pot non alloué.");
  }
  else if(a==="goal-fund"){
    // Le fonds d'urgence partage ces boutons : id spécial __fu__
    if(el.dataset.id === "__fu__"){
      const amtFU = parseAmount(document.getElementById("goal-in-__fu__")?.value);
      if(!amtFU || amtFU<=0){ toast("Saisissez un montant à attribuer."); return; }
      const libreFU = epargnePot() - ((+S.fuEpargne||0) + S.goals.reduce((s,x)=>s+(+x.epargne||0),0));
      if(libreFU < amtFU){
        const manque = amtFU - Math.max(0, libreFU);
        S.transactions.push({id:uid(), date: todayISO(), label: "Virement épargne — fonds d'urgence", montant: manque, cat: "epargne"});
      }
      S.fuEpargne = (+S.fuEpargne||0) + amtFU;
      save(); render(); toast(fmt0.format(amtFU) + " attribués au fonds d'urgence 🛟");
      return;
    }
    const g = S.goals.find(x=>x.id===el.dataset.id);
    if(!g) return;
    const amt = parseAmount(document.getElementById("goal-in-"+el.dataset.id)?.value);
    if(!amt || amt<=0){ toast("Saisissez un montant à attribuer."); return; }
    const libre = epargnePot() - ((+S.fuEpargne||0) + S.goals.reduce((s,x)=>s+(+x.epargne||0),0));
    if(libre < amt){
      const manque = amt - Math.max(0, libre);
      S.transactions.push({id:uid(), date: todayISO(), label: "Virement épargne — " + g.nom, montant: manque, cat: "epargne"});
    }
    g.epargne = (+g.epargne||0) + amt;
    save(); render(); toast(fmt0.format(amt) + " attribués à « " + g.nom + " » 🐷" + (libre < amt ? " (virement d'épargne complémentaire créé)" : ""));
  }
  else if(a==="goal-free"){
    const g = S.goals.find(x=>x.id===el.dataset.id);
    if(!g) return;
    g.epargne = 0; save(); render(); toast("Épargne rendue au pot non alloué.");
  }
  else if(a==="goal-del"){
    S.goals = S.goals.filter(g=>g.id!==el.dataset.id);
    save(); render(); toast("Objectif supprimé — son épargne retourne dans le pot.");
  }
  else if(a==="fu-fund"){
    const amt = parseAmount(document.getElementById("goal-in-__fu__")?.value);
    if(!amt || amt<=0){ toast("Saisissez un montant à attribuer."); return; }
    const libre = epargnePot() - ((+S.fuEpargne||0) + S.goals.reduce((s,x)=>s+(+x.epargne||0),0));
    if(libre < amt){
      const manque = amt - Math.max(0, libre);
      S.transactions.push({id:uid(), date: todayISO(), label: "Virement épargne — fonds d'urgence", montant: manque, cat: "epargne"});
    }
    S.fuEpargne = (+S.fuEpargne||0) + amt;
    save(); render(); toast(fmt0.format(amt) + " attribués au fonds d'urgence 🛟" + (libre < amt ? " (virement d'épargne complémentaire créé)" : ""));
  }
  else if(a==="fu-free"){
    S.fuEpargne = 0; save(); render(); toast("Fonds d'urgence libéré — épargne rendue au pot.");
  }
  else if(a==="install-app"){
    if(window.__installPrompt){
      window.__installPrompt.prompt();
      window.__installPrompt = null;
    } else {
      toast("Menu du navigateur → « Installer Mon Budget » (icône ⊕ dans la barre d'adresse).");
    }
  }
  else if(a==="lic-activate"){
    const brut = (document.getElementById("lic-cle").value||"").trim();
    if(!brut){ toast("Collez votre clé de licence."); return; }
    const st = document.getElementById("lic-status");
    // Clé développeur (MB-…) : validation locale instantanée
    if(/^MB-/i.test(brut)){
      const cle = brut.toUpperCase();
      if(!cleValide(cle)){ toast("Clé Mon Budget invalide."); return; }
      S.license = {cle, type:"dev"};
      save(); render(); toast("Mon Budget Plus activé 🎉");
      return;
    }
    // Clé Lemon Squeezy (reçue par email après achat) : validation en ligne, une seule fois
    if(st){ st.textContent = "🔎 Vérification de la clé en ligne…"; st.style.color = "var(--muted)"; }
    activerCleLemonSqueezy(brut, st);
  }
  else if(a==="lic-remove"){
    const l = S.license;
    if(l && l.type==="ls" && l.cle){
      fetch("https://api.lemonsqueezy.com/v1/licenses/deactivate", {
        method: "POST",
        headers: {"Content-Type": "application/json", "Accept": "application/json"},
        body: JSON.stringify({license_key: l.cle, instance_id: l.instance||""})
      }).catch(()=>{});
    }
    S.license = {cle:""}; save(); render(); toast("Licence désactivée.");
  }
  else if(a==="goto-landing"){ location.href = "index.html#tarifs"; }
  else if(a==="print-bilan"){
    if(!exigerPlus("L'export PDF")) return;
    window.print();
  }
  else if(a==="welcome-demo"){
    S.visite = true; save(); render(); toast("Vous explorez la démo — remplacez les chiffres par les vôtres dans Paramètres.");
  }
  else if(a==="welcome-zero"){
    S = {
      v:1, cats:CATS.map(c=>({...c})),
      settings:{revenus:[], objectif:0, jourPaie:28, chargesFixes:[], devise:(S.settings.devise||"EUR"), fuMois:3, theme:(S.settings.theme||"sombre")},
      budgets:{}, transactions:[], plan:{}, rules:[], goals:[], fuEpargne:0,
      license:S.license||{cle:""}, visite:true, savedAt:Date.now()
    };
    save(); UI.tab = "settings"; render();
    toast("À vous de jouer — renseignez vos revenus et vos charges fixes.");
  }
  else if(a==="partner-open" || a==="partner-replace"){ const f = document.getElementById("partner-file"); if(f) f.click(); }
  else if(a==="partner-remove"){
    // Si on est sur le budget du partenaire, rebasculer d'abord sur le sien
    if(S.actifBudget === "partenaire"){
      if(S.monBudget) appliquerEtat(S.monBudget);
      S.actifBudget = "moi";
    }
    S.partner = null; S.partnerNom = "";
    save(); render(); toast("Budget partenaire retiré — vous êtes de retour sur votre budget.");
  }
  else if(a==="goto-plus"){
    UI.tab = "settings"; render();
    const c = Array.prototype.slice.call(document.querySelectorAll(".settings-card")).find(x => x.textContent.indexOf("Mon Budget Plus") > -1);
    if(c) c.scrollIntoView({ block: "center" });
  }
  else if(a==="fam-enfant-add"){
    const nom = (document.getElementById("new-fam-nom").value||"").trim();
    if(!nom){ toast("Saisissez le prénom de l'enfant."); return; }
    const avatar = document.getElementById("new-fam-avatar").value || "🦊";
    const poche = parseAmount(document.getElementById("new-fam-poche").value) || 0;
    S.famille.enfants.push({id:uid(), nom, avatar, solde:0, poche, dernierePoche:null, missions:[], objectifs:[], historique:[]});
    save(); render(); toast(`Tirelire de ${nom} créée ! 🐷`);
  }
  else if(a==="fam-enfant-del"){
    S.famille.enfants = S.famille.enfants.filter(e=>e.id!==el.dataset.id);
    save(); render(); toast("Tirelire supprimée.");
  }
  else if(a==="fam-mission-add"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    const nom = (document.getElementById("fam-m-"+e.id).value||"").trim();
    const rec = parseAmount(document.getElementById("fam-mr-"+e.id).value);
    if(!nom || !rec || rec<=0){ toast("Saisissez une mission et sa récompense."); return; }
    e.missions.push({id:uid(), nom, recompense:rec, derniere:null});
    save(); render(); toast(`Mission « ${nom} » ajoutée.`);
  }
  else if(a==="fam-mission-del"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    e.missions = e.missions.filter(m=>m.id!==el.dataset.mission);
    save(); render();
  }
  else if(a==="fam-mission-val"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    const m = e.missions.find(x=>x.id===el.dataset.mission);
    if(!m || !semaineEcoulee(m.derniere)) return;
    m.derniere = todayISO();
    e.solde = Math.round((e.solde + m.recompense)*100)/100;
    famHisto(e, "mission", m.nom, m.recompense);
    save(); render(); toast(`${e.nom} gagne ${fmt2.format(m.recompense)} — « ${m.nom} » !`);
  }
  else if(a==="fam-poche"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    if(!(e.poche>0)) { toast("Définissez d'abord un montant de poche pour cet enfant."); return; }
    if(!semaineEcoulee(e.dernierePoche)){ toast("L'argent de poche de la semaine a déjà été versé."); return; }
    e.dernierePoche = todayISO();
    e.solde = Math.round((e.solde + e.poche)*100)/100;
    famHisto(e, "poche", "Argent de poche de la semaine", e.poche);
    save(); render(); toast(`${fmt2.format(e.poche)} versés à ${e.nom} 🐷`);
  }
  else if(a==="fam-bonus" || a==="fam-retrait"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    const amt = parseAmount(document.getElementById("fam-b-"+e.id)?.value);
    if(!amt || amt<=0){ toast("Saisissez un montant."); return; }
    if(a==="fam-retrait") e.solde = Math.max(0, Math.round((e.solde-amt)*100)/100);
    else e.solde = Math.round((e.solde+amt)*100)/100;
    famHisto(e, a==="fam-bonus"?"bonus":"retrait", a==="fam-bonus"?"Bonus":"Retrait", a==="fam-bonus"?amt:-amt);
    save(); render();
  }
  else if(a==="fam-goal-add"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    const nom = (document.getElementById("fam-g-"+e.id).value||"").trim();
    const cible = parseAmount(document.getElementById("fam-gc-"+e.id).value);
    if(!nom || !cible || cible<=0){ toast("Saisissez un objectif et sa cible."); return; }
    e.objectifs.push({id:uid(), nom, cible, epargne:0, atteint:false});
    save(); render(); toast(`Objectif « ${nom} » ajouté — ${e.nom} peut commencer à épargner !`);
  }
  else if(a==="fam-goal-save"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    const o = e.objectifs.find(x=>x.id===el.dataset.goal);
    const amt = parseAmount(document.getElementById("fam-gi-"+o.id)?.value);
    if(!amt || amt<=0){ toast("Saisissez un montant à mettre de côté."); return; }
    const real = Math.min(amt, Math.max(0, e.solde));
    if(real<=0){ toast("La tirelire est vide — validez des missions pour la remplir !"); return; }
    if(real<amt) toast(`Seuls ${fmt2.format(real)} étaient disponibles dans la tirelire.`);
    e.solde = Math.round((e.solde-real)*100)/100;
    o.epargne = Math.round((o.epargne+real)*100)/100;
    famHisto(e, "epargne", `Mise de côté — ${o.nom}`, -real);
    save(); render();
  }
  else if(a==="fam-goal-del"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    e.objectifs = e.objectifs.filter(o=>o.id!==el.dataset.goal);
    save(); render();
  }
  else if(a==="fam-goal-done"){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.enfant);
    const o = e.objectifs.find(x=>x.id===el.dataset.goal);
    if(!o) return;
    o.atteint = true;
    famHisto(e, "objectif", `Objectif atteint : ${o.nom}`, 0);
    save(); render(); toast(`Bravo ${e.nom} — objectif « ${o.nom} » réalisé ! 🎉`);
  }
  else if(a==="fam-add-categorie"){
    if(!cats().some(c=>c.id==="argentdepoche")){
      S.cats.push({id:"argentdepoche", label:"Argent de poche", color:"#fbbf24", bucket:"envies", custom:true});
      S.budgets.argentdepoche = S.budgets.argentdepoche || 0;
    }
    save(); render(); toast("Catégorie « Argent de poche » ajoutée à votre budget.");
  }
  else if(a==="calc-toggle"){
    if(!UI.calc) UI.calc = {visible:false, expr:"0"};
    UI.calc.visible = !UI.calc.visible;
    render();
    const c = document.getElementById("calc-card");
    if(c && UI.calc.visible) c.scrollIntoView({ block: "center" });
  }
  else if(a==="open-cat"){
    UI.tab = "tx";
    UI.txCat = el.dataset.cat || "all";
    UI.txMonth = UI.month;
    render();
    setTimeout(()=>{ const s = document.querySelector('[data-filter="cat"]'); if(s) s.scrollIntoView({block:'center'}); }, 40);
  }
  else if(a==="conj-creer"){
    if(!S.couple) S.couple = {mon:null, partenaire:null, actif:"moi"};
    if(S.actifBudget === "partenaire"){ S.partner = etatActifObj(); }
    else { S.monBudget = etatActifObj(); }
    S.partner = {v:1, nom:"", settings:{revenus:[], objectif:{}, chargesFixes:[], jourPaie:1, devise:(S.settings.devise||"EUR")}, budgets:{}, transactions:[], goals:[]};
    S.partnerNom = "";
    S.actifBudget = "partenaire";
    appliquerEtat(S.partner);
    save(); render();
    toast("Budget du/de la partenaire créé — entrez ses revenus et charges, rebasculez quand vous voulez.");
  }
  else if(a==="conj-moi" || a==="conj-partenaire"){
    var vers = a === "conj-partenaire" ? "partenaire" : "moi";
    if(S.actifBudget === vers){ toast("Ce budget est déjà actif."); return; }
    if(vers === "partenaire" && !S.partner){ toast("Importez d'abord le budget de votre conjoint(e) dans l'onglet Couple."); return; }
    basculerConjoint(vers);
    toast(vers === "partenaire" ? "Budget du/de la conjoint(e) activé." : "Votre budget personnel est actif.");
  }
  else if(a==="export-csv"){ exportCsv(); }
  else if(a==="export-json"){
    await exportFichier("mon-budget-sauvegarde.json", JSON.stringify(S, null, 2), "application/json", "json", "Sauvegarde enregistrée");
  }
  else if(a==="import-json"){ document.getElementById("import-file").click(); }
  else if(a==="seed-demo"){
    if(confirm("Recharger les données de démonstration ? Vos données actuelles seront remplacées.")){
      const d = defaultState(); S.settings = d.settings; S.transactions = d.transactions; S.budgets = d.budgets;
      save(); render(); toast("Données de démo rechargées.");
    }
  }
  else if(a==="clear-all"){
    if(confirm("Effacer TOUTES les données (transactions, budgets, paramètres) ?")){
      S = {v:1, cats:CATS.map(c=>({...c})), settings:defaultSettings(), budgets:defaultBudgets(), transactions:[], plan:{}, rules:[], goals:[], fuEpargne:0};
      S.settings.revenus = []; S.settings.objectif = 0; S.settings.chargesFixes = [];
      save(); render(); toast("Données effacées. Complétez les Paramètres.");
    }
  }
});

document.getElementById("app").addEventListener("change", e=>{
  const el = e.target;

  if(el.dataset.imap){
    UI.import.map[el.dataset.imap] = +el.value;
    UI.import.overrides = {};
    render(); return;
  }
  if(el.dataset.icat){
    UI.import.overrides[+el.dataset.icat] = el.value;
    const counts = document.getElementById("import-counts");
    if(counts) counts.innerHTML = importCountsHtml(buildImportRows());
    return;
  }
  if(el.dataset.goal){
    const g = S.goals.find(x=>x.id===el.dataset.goal);
    if(!g) return;
    if(el.dataset.gfield==="nom"){ g.nom = el.value; save(); return; }
    if(el.dataset.gfield==="echeance"){ g.echeance = el.value; save(); render(); return; }
    const v = parseAmount(el.value);
    if(v===null){ render(); return; }
    g.cible = v; save(); render(); return;
  }
  if(el.dataset.fam){
    const e = S.famille.enfants.find(x=>x.id===el.dataset.fam);
    if(!e) return;
    if(el.dataset.ffield==="nom"){ e.nom = el.value; save(); return; }
    const v = parseAmount(el.value);
    if(v===null){ render(); return; }
    e.poche = v; save(); render(); return;
  }
  if(el.dataset.rule){
    const r = S.rules.find(x=>x.id===el.dataset.rule);
    if(!r) return;
    if(el.dataset.rfield==="mot"){ r.mot = el.value; save(); return; }
    r.cat = el.value; save(); return;
  }
  if(el.id==="import-bank" && el.files && el.files[0]){
    const f = el.files[0];
    const rd = new FileReader();
    rd.onload = () => {
      let text = "";
      try{ text = new TextDecoder("utf-8").decode(rd.result); }catch(e){}
      if(text.includes("\uFFFD")){ try{ text = new TextDecoder("windows-1252").decode(rd.result); }catch(e){} }
      handleImportText(f.name, text);
    };
    rd.readAsArrayBuffer(f);
    return;
  }
  if(el.dataset.partage){
    var v = parseInt(el.value, 10);
    if(isNaN(v) || v < 0 || v > 100){ render(); return; }
    S.settings.partage[el.dataset.partage] = v;
    save(); render(); return;
  }
  if(el.dataset.budget){
    const v = parseAmount(el.value);
    if(v===null){ render(); return; }
    S.budgets[el.dataset.budget] = v; save(); render(); return;
  }
  if(el.dataset.rev){
    const r = S.settings.revenus.find(x=>x.id===el.dataset.rev);
    if(!r) return;
    if(el.dataset.rfield==="label"){ r.label = el.value; save(); return; }
    const v = parseAmount(el.value);
    if(v===null){ render(); return; }
    r.montant = v; save(); render(); return;
  }
  if(el.dataset.set==="partnerNom"){ S.partnerNom = el.value; save(); return; }
  if(el.id==="partner-file" && el.files && el.files[0]){
    const f = el.files[0];
    const rd = new FileReader();
    rd.onload = () => {
      try{
        var p = null;
        if(/\.csv$/i.test(f.name) || /^\s*[^{\[]/.test(String(rd.result||""))){
          // CSV : transactions seules → budget partenaire avec réglages par défaut
          p = csvVersPartner(rd.result, f.name);
          if(!p){ toast("Aucune transaction exploitable dans ce CSV."); return; }
        } else {
          var j = JSON.parse(rd.result);
          if(j && j.v===1 && j.settings) p = j;
        }
        if(p){
          S.partner = p;
          if(!S.partnerNom) S.partnerNom = "Partenaire";
          save(); render(); toast("Budget partenaire importé — vue consolidée disponible.");
        } else toast("Ce fichier n'est pas une sauvegarde Mon Budget.");
      }catch(err){ toast("Fichier illisible."); }
    };
    rd.readAsText(f);
    return;
  }
  if(el.dataset.set==="theme"){
    if(!estPlus()){ toast("Le thème clair fait partie de Mon Budget Plus — activez votre licence."); render(); return; }
    S.settings.theme = el.value; applyTheme(); save(); render(); return;
  }
  if(el.dataset.set==="devise"){
    if(!estPlus()){ toast("Le multi-devises fait partie de Mon Budget Plus — activez votre licence."); render(); return; }
    S.settings.devise = el.value; rebuildFormatters(); save(); render(); return;
  }
  if(el.dataset.set){
    if(el.dataset.set==="jourPaie"){ S.settings.jourPaie = +el.value; save(); render(); return; }
    const v = parseAmount(el.value);
    if(v===null){ render(); return; }
    S.settings[el.dataset.set] = v; save(); render(); return;
  }
  if(el.dataset.charge){
    const c = S.settings.chargesFixes.find(x=>x.id===el.dataset.charge);
    if(!c) return;
    if(el.dataset.cfield==="label"){ c.label = el.value; save(); return; }
    if(el.dataset.cfield==="cat"){ c.cat = el.value; save(); render(); return; }
    const v = parseAmount(el.value);
    if(v===null){ render(); return; }
    c.montant = v; save(); render(); return;
  }
  if(el.dataset.check){
    S.plan[el.dataset.check] = el.checked; save(); render(); return;
  }
  if(el.dataset.filter==="month"){ UI.txMonth = el.value; render(); return; }
  if(el.dataset.filter==="cat"){ UI.txCat = el.value; render(); return; }
  if(el.id==="import-file" && el.files && el.files[0]){
    const f = el.files[0];
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const p = JSON.parse(rd.result);
        if(p && p.v===1 && p.settings && Array.isArray(p.transactions)){
          S = p; save(); render(); toast("Sauvegarde restaurée.");
        } else toast("Fichier invalide.");
      }catch(err){ toast("Fichier illisible."); }
    };
    rd.readAsText(f);
  }
});

document.getElementById("app").addEventListener("submit", e=>{
  const f = e.target;
  if(f.id!=="quick-add") return;
  e.preventDefault();
  const montant = parseAmount(f.montant.value);
  const label = f.libelle.value.trim();
  if(!montant || montant<=0){ toast("Saisissez un montant valide."); document.getElementById("tx-amount")?.focus(); return; }
  if(!label){ toast("Saisissez un libellé."); document.getElementById("tx-label")?.focus(); return; }
  S.transactions.push({id:uid(), date:f.date.value || todayISO(), label, montant, cat:f.cat.value});
  UI.month = (f.date.value || todayISO()).slice(0,7);
  save(); render();
  toast(`« ${label} » ajouté (${fmt2.format(montant)}).`);
});

bootStore().then(() => {
  UI.month = monthKey(new Date());
  render();
});

document.getElementById("btn-undo").addEventListener("click", annuler);

  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

  e.preventDefault();
  window.__installPrompt = e;
  document.body.classList.add("can-install");
});
if (window.matchMedia("(display-mode: standalone)").matches) {

}
