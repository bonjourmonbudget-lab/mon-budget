<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0b12">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mon Budget — Pilote ton budget, mois après mois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b12;
    --card:#14141d;
    --card-2:#171722;
    --border:#23232f;
    --border-2:#2a2a38;
    --text:#f3f3f7;
    --muted:#8d8da1;
    --muted-2:#6d6d80;
    --accent:#8b5cf6;
    --accent-soft:#a78bfa;
    --green:#34d399;
    --red:#f87171;
    --amber:#fbbf24;
    --grad:linear-gradient(135deg,#7c68f7,#a98afc);
    --card-top:#15151f;
    --card-bot:#12121a;
    --topbar-bg:rgba(13,13,20,.86);
    --nav-active:#1a1a27;
    --nav-active-b:#2c2c3a;
    --nav-hover:#161622;
    --input-bg:#0f0f18;
    --line:#1b1b26;
    --bar-bg:#232333;
    --chip-bg:#181826;
    --chart-grid:#22222e;
    --glow:radial-gradient(1100px 480px at 50% -120px, rgba(124,98,246,.16), transparent 65%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scrollbar-color:#2a2a38 var(--bg)}
  body{
    background:var(--bg);color:var(--text);
    font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.55;min-height:100vh;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(1100px 480px at 50% -120px, rgba(124,98,246,.16), transparent 65%);
  }
  header.topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:26px;flex-wrap:wrap;
    padding:13px 28px;
    background:rgba(13,13,20,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid #1c1c28;
  }
  .brand{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;cursor:pointer;transition:.15s}
  a.brand{color:inherit;text-decoration:none}
  a.brand:hover{opacity:.8}
  .brand svg{display:block}
  .grad-text{background:linear-gradient(90deg,#8f7bff,#c9a5fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav{display:flex;gap:6px;flex-wrap:wrap}
  nav button{
    background:transparent;border:1px solid transparent;color:#b6b6c6;
    font:inherit;font-size:14px;font-weight:600;cursor:pointer;
    padding:8px 14px;border-radius:10px;transition:.15s;
  }
  nav button:hover{color:#fff;background:#161622}
  nav button.active{background:#1a1a27;border-color:#2c2c3a;color:#fff}
  main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:34px 28px 70px}
  footer{
    position:relative;z-index:1;text-align:center;color:var(--muted-2);
    font-size:13px;padding:24px;border-top:1px solid #16161f;
  }

  .hero h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.2}
  .hero .sub{color:var(--muted);margin-top:8px;font-size:15px;max-width:640px}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
  .month-nav{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px}
  .month-nav b{min-width:170px;text-align:center;font-size:14px;padding:0 8px}
  .month-nav button{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:6px 12px;border-radius:9px}
  .month-nav button:hover{color:#fff;background:#1d1d2a}
  .month-nav button.on{background:#1d1d2a;color:#fff}
  .spacer{flex:1}

  .btn{font:inherit;font-size:14px;font-weight:700;cursor:pointer;border-radius:12px;padding:11px 18px;transition:.15s;white-space:nowrap}
  .btn-grad{background:var(--grad);color:#fff;border:none}
  .btn-grad:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--card);border:1px solid var(--border-2);color:#d8d8e4}
  .btn-ghost:hover{border-color:#3a3a4c;color:#fff}
  .btn-danger{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);color:var(--red)}
  .btn-danger:hover{background:rgba(248,113,113,.15)}
  .btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}

  .section{margin-top:36px}
  .section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .section-head h2{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .section-head .hint{color:var(--muted-2);font-size:13px}
  .section-head a{margin-left:auto;color:var(--accent-soft);font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}
  .card{
    background:linear-gradient(180deg,#15151f,#12121a);
    border:1px solid var(--border);border-radius:14px;padding:20px;
  }
  .kpi .lbl{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-size:28px;font-weight:800;margin-top:9px;letter-spacing:-.02em}
  .kpi .val.neg{color:var(--red)}
  .kpi .val.pos{color:var(--green)}
  .kpi .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .kpi .foot{margin-top:14px}
  .kpi .spark{display:block;margin-top:10px}

  .bar{height:7px;border-radius:99px;background:#232333;overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6d5ef0,#a985fc);transition:width .3s}
  .bar-fill.over{background:linear-gradient(90deg,#f87171,#fb923c)}
  .bar-fill.good{background:linear-gradient(90deg,#10b981,#34d399)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid;white-space:nowrap}
  .badge.ok{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
  .badge.warn{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
  .badge.over{color:var(--red);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.09)}

  .proj .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .proj .row1 .hint{margin-left:auto}

  .alert-strip{
    margin-top:16px;display:flex;gap:10px;align-items:flex-start;
    background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.3);
    border-radius:12px;padding:13px 16px;font-size:13.5px;color:#fca5a5;
  }

  .grid-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
  .env-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
  .env-layout.with-calc{grid-template-columns:300px minmax(0,1fr) 290px}
  .env-layout.with-calc .grid-cats{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media(max-width:1180px){.env-layout.with-calc{grid-template-columns:320px minmax(0,1fr)} .env-layout.with-calc > #calc-card{grid-column:1/-1;max-width:none}}
  @media(max-width:980px){.env-layout{grid-template-columns:1fr}}
  .cat-card .row1{display:flex;align-items:center;gap:9px}
  .cat-card .row1 .name{font-weight:600;font-size:14px}
  .cat-card .row1 .badge{margin-left:auto}
  .dot{width:9px;height:9px;border-radius:99px;flex:none}
  .cat-card .nums{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin:11px 0 7px}
  .cat-card .nums b{color:var(--text);font-weight:700}
  .fx-list{display:flex;flex-direction:column;gap:7px;margin:12px 0 10px}
  .fx-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c9c9d8;min-width:0}
  .fx-item .lblx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx-item .amt{margin-left:auto;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}

  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
  .feature h3{font-size:16px;font-weight:800}
  .feature p{color:var(--muted);font-size:13.5px;margin:9px 0 13px}
  .feature a{color:var(--accent-soft);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none}
  .feature a:hover{text-decoration:underline}

  .tx-table{width:100%;border-collapse:collapse;font-size:14px}
  .tx-table th{
    text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--border);
  }
  .tx-table td{padding:10px;border-bottom:1px solid #1b1b26;vertical-align:middle}
  .tx-table tr:hover td{background:#15151f}
  .tx-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .tx-table .pos{color:var(--green)}
  .tx-table .catcell{display:flex;align-items:center;gap:8px;color:#c9c9d8}
  .tx-table .datecell{color:var(--muted);white-space:nowrap}
  .icon-btn{
    background:transparent;border:1px solid var(--border-2);color:var(--muted);
    border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:12px;line-height:1;
  }
  .icon-btn:hover{color:var(--red);border-color:rgba(248,113,113,.4)}

  form.panel{display:grid;grid-template-columns:150px 1fr 150px 210px auto;gap:10px;align-items:end}
  @media (max-width:900px){form.panel{grid-template-columns:1fr 1fr}}
  label.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
  input,select{
    background:#0f0f18;border:1px solid var(--border-2);border-radius:10px;
    padding:10px 12px;color:#fff;font:inherit;font-size:14px;width:100%;
  }
  input:focus,select:focus{outline:none;border-color:#6d5ef0;box-shadow:0 0 0 3px rgba(109,94,240,.18)}
  input::placeholder{color:#55556a}

  .envelope{margin-top:12px}
  .envelope .top{display:flex;align-items:center;gap:9px}
  .envelope .top .name{font-weight:600}
  .envelope .top .badge{margin-left:auto}
  .envelope .mid{margin:11px 0 8px}
  .envelope .bot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .envelope .bot .nums{color:var(--muted);font-size:12.5px;flex:1;min-width:160px}
  .envelope .bot .nums b{color:var(--text)}
  .envelope .bot input{width:120px;padding:7px 10px;font-size:13.5px;text-align:right}

  .buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
  .bucket .lbl2{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .bucket .val2{font-size:22px;font-weight:800;margin:8px 0 2px}
  .bucket .rec{color:var(--muted);font-size:12.5px}

  .gauge-line{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}
  .gauge-line b{color:var(--text)}

  .plan-step{position:relative;padding-left:58px}
  .plan-step .stepnum{
    position:absolute;left:20px;top:20px;width:28px;height:28px;border-radius:99px;
    background:var(--grad);color:#fff;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .plan-step h3{font-size:16.5px;font-weight:800}
  .plan-step .when{color:var(--muted-2);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#181826;border:1px solid var(--border-2);border-radius:99px;padding:6px 12px;font-size:12.5px;color:#c9c9d8}
  .chip b{color:#fff}
  .plan-step p.body{color:var(--muted);font-size:13.5px;margin:8px 0 4px}
  .checks{margin-top:12px;display:flex;flex-direction:column;gap:9px}
  .checks label{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#c9c9d8;cursor:pointer}
  .checks input{width:16px;height:16px;margin-top:2px;accent-color:#8b5cf6;flex:none}
  .checks label.done span{color:var(--muted-2);text-decoration:line-through}

  .goal .top{display:flex;align-items:center;gap:10px}
  .goal .goal-nom{font-weight:700;font-size:15px;flex:1;background:transparent;border:1px solid transparent;padding:6px 8px}
  .goal .goal-nom:hover,.goal .goal-nom:focus{border-color:var(--border-2);background:#0f0f18}
  .goal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .goal .controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .goal .nums{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:11px}
  .goal .nums b{color:var(--text)}

  /* --- Mode Famille --- */
  .fam{position:relative}
  .fam-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fam-avatar{width:44px;height:44px;border-radius:99px;background:var(--nav-active);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
  .fam-nom{font-weight:800;font-size:16px;flex:1;min-width:110px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:var(--text)}
  .fam-nom:hover,.fam-nom:focus{border-color:var(--border-2);background:var(--input-bg)}
  .fam-poche-lbl{color:var(--muted);font-size:12px}
  .fam-poche{width:64px;text-align:right;padding:7px 9px}
  .fam-solde{display:flex;align-items:center;gap:10px;margin-top:14px}
  .fam-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .fam-badge-off{opacity:.35}
  .fam-section{margin-top:16px;padding-top:14px;border-top:1px dashed var(--border)}
  .fam-section-title{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .fam-mission{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .fam-mission.fait .fam-mission-nom{color:var(--muted-2);text-decoration:line-through}
  .fam-mission-nom{flex:1;min-width:120px}
  .fam-mission-prix{font-weight:700;font-variant-numeric:tabular-nums}
  .fam-goal{margin-bottom:14px}
  .fam-goal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:13.5px;flex-wrap:wrap}
  .fam-goal-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .fam-histo-line{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--line)}
  .fam-histo-line .num{margin-left:auto}

  /* Bouton Annuler (dans la navigation, après Paramètres) */
  #btn-undo{color:var(--amber);border-color:rgba(251,191,36,.4)}
  #btn-undo:hover{color:#fff;border-color:var(--amber);background:rgba(251,191,36,.12)}

  .btn-home{
    margin-left:auto;display:inline-flex;align-items:center;gap:6px;
    background:var(--nav-active);border:1px solid var(--border-2);color:#d8d8e4;
    padding:8px 14px;border-radius:10px;font-weight:600;font-size:13.5px;
    transition:.15s;text-decoration:none
  }
  .btn-home:hover{color:#fff;border-color:var(--accent-soft);background:var(--nav-hover)}

  /* Bouton retour en haut — à droite, centré verticalement */
  #haut-page{
    position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:45;width:48px;height:48px;
    border-radius:50%;background:var(--grad);color:#fff;border:none;font-size:20px;font-weight:800;
    cursor:pointer;box-shadow:0 8px 24px rgba(124,98,246,.4);transition:.15s;display:none;align-items:center;justify-content:center
  }
  #haut-page:hover{filter:brightness(1.12)}

  /* Cartes d'enveloppes cliquables (tableau de bord) */
  .cat-click{cursor:pointer;transition:border-color .15s, transform .15s}
  .cat-click:hover{border-color:var(--accent-soft);transform:translateY(-2px)}

  /* --- Calculatrice du tableau de bord --- */
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .calc-key{
    padding:12px 0;border-radius:10px;background:var(--nav-active);
    border:1px solid var(--border-2);color:var(--text);font-weight:700;
    font-size:15px;cursor:pointer;font-family:inherit;transition:.12s
  }
  .calc-key:hover{background:var(--nav-hover);border-color:var(--accent-soft)}
  .calc-eq{background:var(--grad);color:#fff;border:none}
  .calc-key.calc-c{color:var(--red)}
  .calc-reset{
    width:100%;margin-top:8px;padding:10px;border-radius:10px;
    background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);
    color:var(--red);font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.12s
  }
  .calc-reset:hover{background:rgba(248,113,113,.22)}
  .calc-key.calc-flash{background:var(--accent-soft);color:#fff;border-color:var(--accent-soft)}

  /* --- Application des variables de thème (surcharges en fin de cascade) --- */
  body::before{background:var(--glow)}
  header.topbar{background:var(--topbar-bg)}
  nav button{color:#b6b6c6}
  nav button:hover{background:var(--nav-hover)}
  nav button.active{background:var(--nav-active);border-color:var(--nav-active-b)}
  .card{background:linear-gradient(180deg,var(--card-top),var(--card-bot))}
  input,select{background:var(--input-bg)}
  .bar{background:var(--bar-bg)}
  .chip{background:var(--chip-bg);border-color:var(--chip-b)}
  .tx-table td{border-bottom-color:var(--line)}
  .tx-table tr:hover td{background:var(--nav-hover)}
  footer{border-top-color:var(--border)}
  .month-nav{background:var(--card);border-color:var(--border)}
  .month-nav button:hover{background:var(--nav-hover)}
  .step{background:var(--card)}

  /* --- Thème clair (Mon Budget Plus) --- */
  body[data-theme="clair"]{
    --bg:#f4f4f9; --card:#ffffff; --border:#e3e3ee; --border-2:#d9d9e8;
    --text:#1b1b26; --muted:#5d5d72; --muted-2:#8a8aa0;
    --card-top:#ffffff; --card-bot:#f8f8fd;
    --topbar-bg:rgba(255,255,255,.9); --nav-active:#ecebf8; --nav-active-b:#d9d9ee; --nav-hover:#f1f0fa;
    --input-bg:#ffffff; --line:#eaeaf2; --bar-bg:#e6e6f0; --chip-bg:#f2f1fb; --chip-b:#dcdcf0;
    --chart-grid:#e4e4ee;
    --glow:radial-gradient(1100px 480px at 50% -120px, rgba(124,98,246,.10), transparent 65%);
  }
  body[data-theme="clair"] .kpi .val{color:var(--text)}

  /* --- Thème grand contraste (Mon Budget Plus) --- */
  body[data-theme="contraste"]{
    --bg:#000; --card:#0d0d0d; --border:#8a8a8a; --border-2:#9a9a9a;
    --text:#ffffff; --muted:#e0e0e0; --muted-2:#c0c0c0;
    --card-top:#0d0d0d; --card-bot:#050505;
    --topbar-bg:#000; --nav-active:#262626; --nav-active-b:#8a8a8a; --nav-hover:#1b1b1b;
    --input-bg:#000; --line:#3d3d3d; --bar-bg:#333; --chip-bg:#101010; --chip-b:#8a8a8a;
    --chart-grid:#5a5a5a;
    --glow:none;
  }

  /* --- Impression / Export PDF --- */
  @media print{
    body{--bg:#fff; --card:#fff; --border:#ddd; --border-2:#ddd; --text:#111; --muted:#555; --muted-2:#777;
      --card-top:#fff; --card-bot:#fff; --line:#e5e5e5; --bar-bg:#eee; --chip-bg:#f5f5f5; --chip-b:#ddd;
      --chart-grid:#e5e5e5; --glow:none; --topbar-bg:transparent}
    body::before,header.topbar,footer,.toolbar,.month-nav,.btn,.icon-btn,.alert-strip,.standalone-note{display:none !important}
    main{max-width:none;padding:0}
    .card{box-shadow:none;break-inside:avoid}
    .hero .ctas{display:none}
    section{padding-top:14px}
    .badge{color:#333 !important;border-color:#bbb !important;background:#fff !important}
  }


  .settings-card .row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .settings-card .row input{padding:9px 12px}
  .settings-card .row .lab{flex:1;min-width:130px}
  .settings-card .row .mont{width:140px;text-align:right}
  .settings-card .row .cat-sel{width:175px;flex:none;padding:9px 10px}

<script>
"use strict";

/* ============================== Modèle de données ============================== */

const LS_KEY = "monBudget.v1";

const CATS = [
  {id:"alimentation", label:"Alimentation",       color:"#a78bfa", bucket:"besoins"},
  {id:"transport",    label:"Transport",          color:"#60a5fa", bucket:"besoins"},
  {id:"sante",        label:"Santé",              color:"#f472b6", bucket:"besoins"},
  {id:"loisirs",      label:"Loisirs & sorties",  color:"#34d399", bucket:"envies"},
  {id:"restaurants",  label:"Restaurants & bars", color:"#fbbf24", bucket:"envies"},
  {id:"shopping",     label:"Shopping & maison",  color:"#22d3ee", bucket:"envies"},
  {id:"autre",        label:"Autre",              color:"#9ca3af", bucket:"envies"},
  {id:"epargne",      label:"Épargne & projets",  color:"#c084fc", bucket:"epargne"},
];
const cats = () => (Array.isArray(S.cats) && S.cats.length ? S.cats : CATS);
const catOf = id => cats().find(c=>c.id===id) || {id, label:id, color:"#9ca3af", bucket:"envies"};

function slugId(name){
  const base = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "cat";
  let id = base, i = 2;
  while(cats().some(c=>c.id===id)){ id = `${base}-${i++}`; }
  return id;
}

const FIXED_CATS = [
  {id:"logement",   label:"Logement",           color:"#a78bfa"},
  {id:"credit",     label:"Crédits",            color:"#f472b6"},
  {id:"dettes",     label:"Dettes",             color:"#f87171"},
  {id:"abonnement", label:"Abonnements",        color:"#60a5fa"},
  {id:"energie",    label:"Énergie & télécoms", color:"#fbbf24"},
  {id:"banque",     label:"Banque",             color:"#fb923c"},
  {id:"assurance",  label:"Assurances",         color:"#34d399"},
  {id:"transport",  label:"Transport",          color:"#22d3ee"},
  {id:"coiffeur",   label:"Coiffeur",           color:"#e879f9"},
  {id:"autre",      label:"Autre",              color:"#9ca3af"},
];
const fixedCatOf = id => FIXED_CATS.find(c=>c.id===id) || FIXED_CATS[FIXED_CATS.length-1];

function guessFixedCat(label){
  const s = (label||"").toLowerCase();
  if(/loyer|charges locatives|hypoth|bail|résidence|residence/.test(s)) return "logement";
  if(/cr[eé]dit|pr[eê]t|mensualit/.test(s)) return "credit";
  if(/dette|d[eé]couvert|cr[eé]ancier/.test(s)) return "dettes";
  if(/abonnement|streaming|netflix|spotify|disney|mobile|forfait|salle|sport|gym|cin[eé]|box tv/.test(s)) return "abonnement";
  if(/électr|elec|gaz|eau|internet|télécom|telecom|box|fibre|chauffage/.test(s)) return "energie";
  if(/banque|frais bancaire|agios|tenue de compte|carte bancaire/.test(s)) return "banque";
  if(/assurance|mutuelle|prévoyance|prevoyance/.test(s)) return "assurance";
  if(/transport|bus|m[eé]tro|train|essence|carburant|parking|p[eé]age/.test(s)) return "transport";
  if(/coiff|barb|esth|onglerie|institut/.test(s)) return "coiffeur";
  return "autre";
}

const BUCKETS = [
  {id:"besoins", label:"Besoins essentiels", target:0.50, color:"#a78bfa"},
  {id:"envies",  label:"Envies & loisirs",   target:0.30, color:"#fbbf24"},
  {id:"epargne", label:"Épargne",            target:0.20, color:"#34d399"},
];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

function defaultSettings(){
  return {
    revenus: [
      {id:uid(), label:"Salaire principal",       montant:1800},
      {id:uid(), label:"Freelance / heures sup.", montant:300},
    ],
    objectif: 200,
    jourPaie: 28,
    chargesFixes: [
      {id:uid(), label:"Loyer + charges locatives",        montant:850, cat:"logement"},
      {id:uid(), label:"Crédits (auto + conso)",           montant:220, cat:"credit"},
      {id:uid(), label:"Abonnements (streaming, mobile)",  montant:65,  cat:"abonnement"},
      {id:uid(), label:"Énergie & télécoms",               montant:115, cat:"energie"},
    ],
  };
}

function defaultBudgets(){
  return {alimentation:290, transport:85, sante:40, loisirs:80, restaurants:60, shopping:65, autre:30, epargne:200};
}

function seedTransactions(){
  const rng = mulberry32(20260918);
  const out = [];
  const pick = arr => arr[Math.floor(rng()*arr.length)];
  const amount = (min,max) => Math.round((min + rng()*(max-min))*2)/2;
  const pools = {
    alimentation:["Supermarché","Marché","Épicerie de quartier","Boulangerie"],
    transport:["Essence","Abonnement transport","Péage"],
    loisirs:["Cinéma","Sortie entre amis","Salle de sport"],
    restaurants:["Restaurant","Bar","Livraison"],
    shopping:["Vêtements","Articles maison","Rayon divers"],
    sante:["Pharmacie","Consultation médicale"],
    autre:["Divers"],
  };
  const plan = [
    {cat:"alimentation", nMin:4, nMax:5, min:55, max:95},
    {cat:"transport",    nMin:1, nMax:2, min:35, max:55},
    {cat:"loisirs",      nMin:1, nMax:2, min:15, max:45},
    {cat:"restaurants",  nMin:2, nMax:3, min:15, max:38},
    {cat:"shopping",     nMin:0, nMax:1, min:25, max:85},
    {cat:"sante",        nMin:0, nMax:1, min:12, max:45},
    {cat:"autre",        nMin:0, nMax:1, min:10, max:30},
  ];
  const months = ["2026-04","2026-05","2026-06","2026-07","2026-08","2026-09"];
  const epargne = {"2026-04":100,"2026-05":120,"2026-06":130,"2026-07":150,"2026-08":170,"2026-09":200};
  const isCurrent = new Date();
  for(const m of months){
    const maxY = (m === `${isCurrent.getFullYear()}-${String(isCurrent.getMonth()+1).padStart(2,"0")}`) ? isCurrent.getDate() : 28;
    const factor = maxY <= 18 ? 0.6 : 1;
    for(const p of plan){
      let n = p.nMin + Math.floor(rng()*(p.nMax - p.nMin + 1));
      n = Math.max(0, Math.round(n*factor));
      for(let i=0;i<n;i++){
        const day = 1 + Math.floor(rng()*maxY);
        out.push({id:uid(), date:`${m}-${String(day).padStart(2,"0")}`, label:pick(pools[p.cat]), montant:amount(p.min,p.max), cat:p.cat});
      }
    }
    const dEp = Math.min(2, maxY);
    out.push({id:uid(), date:`${m}-${String(dEp).padStart(2,"0")}`, label:"Virement épargne", montant:epargne[m], cat:"epargne"});
  }
  return out;
}

function defaultState(){
  return {v:1, cats:CATS.map(c=>({...c})), settings:defaultSettings(), budgets:defaultBudgets(), transactions:seedTransactions(), plan:{}, rules:[],
    goals:[{id:uid(), nom:"Voyage en Italie", cible:800, echeance:"2027-06-30", epargne:120}], fuEpargne:250, visite:false};
}

function normalize(st){
  if(!Array.isArray(st.settings.revenus)){
    st.settings.revenus = [{id:uid(), label:"Revenu net mensuel", montant:+st.settings.revenu||0}];
  }
  if(!Array.isArray(st.cats) || !st.cats.length){
    st.cats = CATS.map(c=>({...c}));
  }
  if(!Array.isArray(st.rules)) st.rules = [];
  if(!Array.isArray(st.goals)) st.goals = [];
  if(typeof st.fuEpargne !== "number") st.fuEpargne = 0;
  if(!st.license || typeof st.license !== "object") st.license = {cle:""};
  if(typeof st.visite !== "boolean") st.visite = true; // états antérieurs à l'écran de bienvenue : utilisateurs existants
  if(!st.famille || !Array.isArray(st.famille.enfants)) st.famille = {enfants:[]};
  if(!st.actifBudget) st.actifBudget = "moi";
  if(!st.settings.partage) st.settings.partage = {besoins:50, envies:30, epargne:20};
  for(const c of (st.settings.chargesFixes||[])){
    if(!c.cat) c.cat = guessFixedCat(c.label);
  }
  return st;
}
let S = null; // état chargé au démarrage (bootStore) — source de vérité en mémoire

/* --- Stockage : IndexedDB (persistant sur mobile) + miroir localStorage (durabilité immédiate) --- */

function lsRead(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && p.v===1 && p.settings) return p;
    }
  }catch(e){}
  return null;
}

const IDB_NAME = "monBudget", IDB_STORE = "kv";
function idbOpen(){
  return new Promise((res, rej) => {
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = () => { if(!rq.result.objectStoreNames.contains(IDB_STORE)) rq.result.createObjectStore(IDB_STORE); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
function idbPut(key, val){
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key){
  return idbOpen().then(db => new Promise((res, rej) => {
    const rq = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  }));
}

let __storeTimer = null;
let __undoPile = [];
let __skipPush = false;
function save(){
  if(!S) return;
  if(!__skipPush){
    try{
      const ancien = localStorage.getItem(LS_KEY);
      if(ancien){ __undoPile.push(ancien); if(__undoPile.length > 15) __undoPile.shift(); }
    }catch(e){}
  }
  __skipPush = false;
  S.savedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(!__storeTimer){
    __storeTimer = setTimeout(() => {
      __storeTimer = null;
      idbPut("state", S).catch(() => {});
    }, 350);
  }
}
function annuler(){
  if(!__undoPile.length){ toast("Rien à annuler."); return; }
  try{
    const p = JSON.parse(__undoPile.pop());
    if(p && p.v===1 && p.settings) S = normalize(p);
  }catch(e){}
  __skipPush = true;
  applyTheme(); rebuildFormatters(); save(); render();
  toast("Action annulée ↩");
}

async function bootStore(){
  const lsState = lsRead();
  let idbState = null;
  try{
    const rec = await idbGet("state");
    if(rec && rec.v===1 && rec.settings) idbState = rec;
  }catch(e){}
  const newer = (a, b) => (!b ? a : (!a ? b : ((a.savedAt||0) >= (b.savedAt||0) ? a : b)));
  const chosen = newer(idbState, lsState);
  if(!idbState && lsState){ try{ await idbPut("state", lsState); }catch(e){} } // migration automatique vers IndexedDB
  S = normalize(chosen || defaultState());
  applyTheme();
  rebuildFormatters();
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
}

/* Synchronisation multi-onglets : si un autre onglet a enregistré des données
   plus récentes, on se resynchronise au retour sur cet onglet. */
function syncMultiOnglets(){
  try{
    if(!S) return;
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const other = JSON.parse(raw);
    const otherAt = (other && other.savedAt) || 0;
    const mineAt = S.savedAt || 0;
    if(otherAt > mineAt && !__storeTimer){
      S = normalize(other);
      applyTheme();
      rebuildFormatters();
      render();
    }
  }catch(e){}
}
window.addEventListener("focus", syncMultiOnglets);
document.addEventListener("visibilitychange", () => { if(!document.hidden) syncMultiOnglets(); });

/* ---- Mode couple : bascule entre les deux budgets ---- */
const CHAMPS_BUDGET = ["settings","budgets","transactions","goals","fuEpargne"];
function etatActifObj(){
  var e = {};
  CHAMPS_BUDGET.forEach(k => e[k] = JSON.parse(JSON.stringify(S[k])));
  return e;
}
function appliquerEtat(etat){
  CHAMPS_BUDGET.forEach(k => S[k] = JSON.parse(JSON.stringify(etat[k])));
}
function basculerConjoint(vers){
  if(!S.couple) S.couple = {mon:null, partenaire:S.partner||null, actif:"moi"};
  // 1) Ranger l'état actuel dans son slot
  if(S.actifBudget === "partenaire"){ S.partner = etatActifObj(); }
  else { S.monBudget = etatActifObj(); }
  // 2) Activer l'autre budget
  S.actifBudget = vers;
  var slot = vers === "partenaire" ? S.partner : S.monBudget;
  if(slot) appliquerEtat(slot);
  save(); render();
}

/* ============================== Licence Mon Budget Plus ============================== */

const LIC_ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
function cleValide(cle){
  const m = String(cle||"").toUpperCase().replace(/\s/g,"").match(/^MB-([A-Z2-7]{4})-([A-Z2-7]{4})-([A-Z2-7]{4})$/);
  if(!m) return false;
  const base = m[1] + m[2];
  let h = 0;
  for(let i=0;i<base.length;i++) h = ((h * 31) + base.charCodeAt(i)) >>> 0;
  h = (h ^ 0x5EED) >>> 0;
  let check = "";
  for(let i=0;i<4;i++){ check += LIC_ALPHABET[h % 32]; h = Math.floor(h / 32); }
  return check === m[3];
}
function estPlus(){
  if(!S || !S.license) return false;
  if(cleValide(S.license.cle)) return true;                 // clé développeur MB-…
  return S.license.type === "ls" && !!S.license.cle;        // clé Lemon Squeezy validée en ligne
}
function exigerPlus(nom){
  if(estPlus()) return true;
  toast("« " + nom + " » fait partie de Mon Budget Plus — activez votre licence dans Paramètres.");
  UI.tab = "settings"; render();
  return false;
}
function applyTheme(){
  document.body.dataset.theme = (S && S.settings && S.settings.theme) || "sombre";
}

/* Activation d'une clé Lemon Squeezy (envoyée automatiquement au client après achat) */
async function activerCleLemonSqueezy(cle, stEl){
  try{
    const rep = await fetch("https://api.lemonsqueezy.com/v1/licenses/activate", {
      method: "POST",
      headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify({license_key: cle, instance_name: "Mon Budget " + new Date().toLocaleDateString("fr-FR")})
    });
    const data = await rep.json();
    if(rep.ok && data.activated && data.license_key && data.license_key.status === "active"){
      S.license = {cle, type:"ls", instance: (data.instance && data.instance.id) || null};
      save(); render();
      toast("Mon Budget Plus activé 🎉 Merci pour votre achat !");
      return;
    }
    if(stEl){
      stEl.textContent = "❌ " + (data.error || data.message || "Clé refusée par Lemon Squeezy.");
      stEl.style.color = "var(--red)";
    }
    toast("Clé refusée — vérifiez la clé reçue par email.");
  }catch(err){
    if(stEl){
      stEl.textContent = "⚠️ Vérification impossible — connectez-vous à internet une fois pour activer la clé.";
      stEl.style.color = "var(--amber)";
    }
    toast("Vérification impossible sans connexion internet.");
  }
}

const UI = { tab:"dash", month:monthKey(new Date()), txMonth:"all", txCat:"all", period:6, calc:{visible:false, expr:"0"} };

/* ============================== Formatage & dates ============================== */

let fmt0, fmt2;
const DEVISES = [["EUR","Euro (€)"],["USD","Dollar US ($)"],["CHF","Franc suisse (CHF)"],["GBP","Livre sterling (£)"],["CAD","Dollar canadien ($ CA)"],["XOF","Franc CFA (F CFA)"]];
function rebuildFormatters(){
  const code = (S && S.settings && S.settings.devise) || "EUR";
  fmt0 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:code,maximumFractionDigits:0});
  fmt2 = new Intl.NumberFormat("fr-FR",{style:"currency",currency:code,minimumFractionDigits:2});
}
rebuildFormatters();
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function monthKey(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function todayISO(){ return monthKey(new Date()) + "-" + String(new Date().getDate()).padStart(2,"0"); }
function shiftMonth(key,d){
  let [y,m] = key.split("-").map(Number);
  m += d; y += Math.floor((m-1)/12); m = ((m-1)%12+12)%12+1;
  return `${y}-${String(m).padStart(2,"0")}`;
}
function monthLabel(key){
  const [y,m] = key.split("-").map(Number);
  const s = new Date(y, m-1, 1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function dateLabel(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return String(d).padStart(2,"0") + "/" + String(m).padStart(2,"0") + "/" + y;
}
function parseAmount(s){
  if(typeof s !== "string") s = String(s ?? "");
  s = s.trim().replace(/\s|\u00A0/g,"").replace(",",".");
  if(!s) return null;
  const v = Number(s);
  return (isFinite(v) && v >= 0) ? v : null;
}

/* ============================== Calculs ============================== */

const chargesTotal = () => S.settings.chargesFixes.reduce((s,c)=>s+(+c.montant||0),0);
const revenuTotal = () => S.settings.revenus.reduce((s,r)=>s+(+r.montant||0),0);
const txIn = month => S.transactions.filter(t => (t.date||"").slice(0,7) === month);
const spentVar = month => txIn(month).filter(t => t.cat!=="epargne").reduce((s,t)=>s+(+t.montant||0),0);
const savedIn  = month => txIn(month).filter(t => t.cat==="epargne").reduce((s,t)=>s+(+t.montant||0),0);
const rav      = () => revenuTotal() - chargesTotal();
const spentByCat = (month,id) => txIn(month).filter(t=>t.cat===id).reduce((s,t)=>s+(+t.montant||0),0);
const budgetOf = id => +S.budgets[id] || 0;

/* Report des enveloppes : le non-dépensé (ou le dépassement) d'un mois roule vers le suivant */
function firstTrackedMonth(){
  const months = S.transactions.map(t=>(t.date||"").slice(0,7)).filter(Boolean).sort();
  return months[0] || monthKey(new Date());
}
function rollover(catId, m){
  let cur = firstTrackedMonth(), sum = 0, guard = 0;
  while(cur < m && guard++ < 240){
    sum += budgetOf(catId) - spentByCat(cur, catId);
    cur = shiftMonth(cur, 1);
  }
  return sum;
}
/* Report : seules les enveloppes marquées ici roulent d'un mois sur l'autre (l'épargne s'accumule) ;
   les enveloppes de dépenses variables repartent à zéro chaque mois */
const ROLLOVER_CATS = new Set(["epargne"]);
const dispoOf = (catId, m) => ROLLOVER_CATS.has(catId) ? budgetOf(catId) + rollover(catId, m) : budgetOf(catId);

function partageTarget(id){
  var p = S.settings.partage || {besoins:50, envies:30, epargne:20};
  return (p[id]||0)/100;
}

function bucketBudget(bucketId){
  let sum = bucketId==="besoins" ? chargesTotal() : 0;
  for(const c of cats()) if(c.bucket===bucketId) sum += budgetOf(c.id);
  return sum;
}
function projection(mois, virement, taux=0.024){
  let solde = 0;
  for(let i=0;i<mois;i++) solde = solde*(1+taux/12) + virement;
  return solde;
}

function parseFlexibleAmount(s){
  if(s==null) return null;
  let t = String(s).replace(/[€$\u00A0\u202F\u2009]/g,"").replace(/\s/g,"").trim();
  if(!t) return null;
  const isNeg = t.includes("-") || /^\(.*\)$/.test(t);
  t = t.replace(/[()\-+]/g,"");
  const lastComma = t.lastIndexOf(","), lastDot = t.lastIndexOf(".");
  if(lastComma>-1 && lastDot>-1){
    if(lastComma>lastDot) t = t.replace(/\./g,"").replace(",",".");
    else t = t.replace(/,/g,"");
  } else if(lastComma>-1){
    const after = t.length - lastComma - 1;
    t = after<=2 ? t.replace(",",".") : t.replace(/,/g,"");
  }
  const v = Number(t);
  if(!isFinite(v)) return null;
  return isNeg ? -Math.abs(v) : v;
}

function parseFlexibleDate(s){
  const t = String(s||"").trim();
  let m;
  if(m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  if(m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){
    let y = +m[3]; if(y<100) y += 2000;
    return `${y}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`;
  }
  if(m = t.match(/^(\d{4})(\d{2})(\d{2})/)) return `${m[1]}-${m[2]}-${m[3]}`;
  return null;
}

function splitCsvLine(line, sep){
  const out = []; let cur = "", inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else if(ch === '"') inQ = true;
    else if(ch === sep){ out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}

function detectSep(text){
  const line = (text.split(/\r?\n/)[0]) || "";
  const counts = {";":0, "\t":0, ",":0};
  for(const ch of line) if(ch in counts) counts[ch]++;
  let best = ";", bestN = 0;
  for(const ch of [";","\t",","]) if(counts[ch]>bestN){ best = ch; bestN = counts[ch]; }
  return best;
}

function parseCsvBank(text){
  const sep = detectSep(text);
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
  if(!lines.length) return {header:[], rows:[]};
  const first = splitCsvLine(lines[0], sep).map(h=>h.replace(/^\uFEFF/,"").trim());
  const looksHeader = first.some(h=>/date/.test(norm(h))) &&
    first.some(h=>/libell|label|operation|montant|debit|credit|descript|nature|intitul|categorie/.test(norm(h)));
  const header = looksHeader ? first : first.map((_,i)=>"Colonne "+(i+1));
  const rows = (looksHeader ? lines.slice(1) : lines).map(l=>splitCsvLine(l, sep));
  let width = header.length;
  for(const r of rows) width = Math.max(width, r.length);
  while(header.length<width) header.push("Colonne "+(header.length+1));
  return {header, rows};
}

function parseOfx(text){
  const rows = [];
  const blocks = text.split(/<STMTTRN>/i).slice(1);
  for(const b of blocks){
    const get = re => { const m = b.match(re); return m ? m[1].trim() : ""; };
    const dt = get(/<DTPOSTED>\s*(\d{8})/i);
    const amt = get(/<TRNAMT>\s*(-?[0-9][0-9.,]*)/i);
    const name = get(/<NAME>\s*([\s\S]*?)<\/NAME>/i) || get(/<MEMO>\s*([\s\S]*?)<\/MEMO>/i);
    const date = dt ? `${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}` : null;
    const montant = parseFlexibleAmount(amt.replace(",","."));
    if(date && montant!=null && montant!==0)
      rows.push([date, name.replace(/&amp;/g,"&").trim(), String(montant).replace(".",",")]);
  }
  return {header:["Date","Libellé","Montant"], rows};
}

function detectCols(header){
  const H = header.map(h=>norm(h));
  const find = re => H.findIndex(h=>re.test(h));
  const date = find(/date/);
  let label = find(/libell|label|intitul|nature|descript|memo/);
  if(label === -1 || label === date) label = find(/operation|transaction/);
  if(label === -1 || label === date) label = find(/virement|carte|prelevement|paiement/);
  if(label === date) label = -1;
  let montant = -1, credit = -1;
  const mi = H.map((h,i)=>(/montant|amount/.test(h) && !/solde/.test(h)) ? i : -1).filter(i=>i>-1);
  const dbi = H.map((h,i)=>/debit/.test(h)?i:-1).filter(i=>i>-1);
  const cri = H.map((h,i)=>/credit/.test(h)?i:-1).filter(i=>i>-1);
  if(mi.length) montant = mi[0];
  else if(dbi.length) montant = dbi[0];
  if(cri.length) credit = cri[0];
  var cat = find(/categor|cat[ée]gorie/);
  return {date, label, montant, credit, cat};
}

function catIdParLibelle(libelle){
  var L = String(libelle||"").trim().toLowerCase();
  if(!L) return null;
  var c = cats().find(function(x){ return x.label.toLowerCase() === L; });
  if(!c) c = cats().find(function(x){ return L.indexOf(x.label.toLowerCase()) > -1; });
  return c ? c.id : null;
}

function csvVersPartner(text, nomFichier){
  var parsed = parseCsvBank(text);
  var cols = detectCols(parsed.header);
  var txs = [];
  parsed.rows.forEach(function(r){
    var d = parseFlexibleDate(cols.date>-1 ? r[cols.date] : "");
    var lbl = cols.label>-1 ? String(r[cols.label]||"").trim() : "";
    var mv = cols.montant>-1 ? parseFlexibleAmount(r[cols.montant]) : null;
    if(d && lbl && mv!==null && mv!==0){
      var catLib = cols.cat>-1 ? (r[cols.cat]||"") : "";
      var cat = catIdParLibelle(catLib) || (cols.cat===-1 && cols.label>-1 ? (autoCatImport(lbl)||"autre") : "autre");
      txs.push({date:d, label:lbl, montant:Math.abs(mv), cat:cat});
    }
  });
  if(!txs.length) return null;
  return {
    v:1, nom:"Partenaire",
    settings:{revenus:[], objectif:{}, chargesFixes:[], jourPaie:1, devise:"EUR"},
    budgets:{}, transactions:txs, goals:[]
  };
}

function autoCatImport(label){
  const L = norm(label);
  for(const cf of S.settings.chargesFixes){
    const C = norm(cf.label);
    if(C.length>=3 && (L.includes(C) || C.includes(L))) return "__ignore__";
  }
  for(const r of S.rules){
    if(r.mot && L.includes(norm(r.mot)) && cats().some(c=>c.id===r.cat)) return r.cat;
  }
  for(const [kw,cat] of BUILTIN_RULES){
    if(L.includes(kw) && cats().some(c=>c.id===cat)) return cat;
  }
  return "autre";
}

function handleImportText(fileName, text){
  try{
    let parsed;
    if(/<STMTTRN|OFXHEADER/i.test(text) || /\.(ofx|qfx)$/i.test(fileName||"")) parsed = parseOfx(text);
    else parsed = parseCsvBank(text);
    if(!parsed.rows.length){ toast("Aucune ligne exploitable dans ce fichier."); return; }
    UI.import = {fileName: fileName||"relevé", header: parsed.header, rows: parsed.rows, map: detectCols(parsed.header), overrides:{}};
    UI.tab = "tx"; render();
    toast(parsed.rows.length + " ligne(s) détectée(s) — vérifiez l'aperçu.");
  }catch(e){ toast("Fichier illisible."); }
}

function buildImportRows(){
  const imp = UI.import; if(!imp) return [];
  imp.overrides = imp.overrides || {};
  const seen = new Set();
  return imp.rows.map((cells, idx)=>{
    const rawDate = imp.map.date>-1 ? cells[imp.map.date] : "";
    const rawLabel = imp.map.label>-1 ? cells[imp.map.label] : "";
    let montant = null, isCredit = false;
    const mv = imp.map.montant>-1 ? parseFlexibleAmount(cells[imp.map.montant]) : null;
    if(imp.map.credit>-1){
      const cv = parseFlexibleAmount(cells[imp.map.credit]);
      if(mv!=null && Math.abs(mv)>0) montant = Math.abs(mv);
      else if(cv!=null && Math.abs(cv)>0){ isCredit = true; montant = Math.abs(cv); }
      else if(mv!=null) montant = Math.abs(mv);
    } else if(mv!=null){ montant = Math.abs(mv); isCredit = mv>0; }
    const date = parseFlexibleDate(rawDate);
    const key = (date||"") + "|" + norm(rawLabel).slice(0,24) + "|" + (montant!=null?montant.toFixed(2):"");
    const dup = seen.has(key) || S.transactions.some(t => (t.date||"")===date && Math.abs(t.montant-montant)<0.005 && norm(t.label).slice(0,24)===norm(rawLabel).slice(0,24));
    seen.add(key);
    const cat = imp.overrides[idx] ?? (isCredit ? "__ignore__" : autoCatImport(rawLabel));
    return {idx, date, label:(rawLabel||"(sans libellé)").trim(), montant, cat, dup, isCredit, valid: !!(date && montant!=null && montant>0)};
  });
}

function importCountsHtml(rows){
  const ready = rows.filter(r=>r.valid && !r.dup && r.cat!=="__ignore__").length;
  const dups = rows.filter(r=>r.dup).length;
  const ign = rows.filter(r=>r.cat==="__ignore__" || !r.valid).length;
  return `<b>${ready}</b> ligne(s) à importer · ${dups} doublon(s) ignoré(s) · ${ign} déjà compté(s)/à ignorer`;
}

function sparkline(vals, color, w=150, h=38){
  if(!vals.length || vals.every(v=>v===vals[0])) vals = vals.length ? vals : [0,0];
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max-min) || 1, pad = 4;
  const pts = vals.map((v,i)=>[
    pad + i*(w-2*pad)/Math.max(1, vals.length-1),
    h - pad - ((v-min)/span)*(h-2*pad),
  ]);
  const d = pts.map(p=>p.map(n=>+n.toFixed(1)).join(",")).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.6" fill="${color}"/>
  </svg>`;
}
function bar(pct){
  const p = Math.max(0, Math.min(100, pct||0));
  return `<div class="bar"><div class="bar-fill${pct>100?" over":""}" style="width:${p}%"></div></div>`;
}
function badgeFor(spent, budget){
  if(budget<=0) return "";
  const pct = spent/budget*100;
  if(pct>100) return `<span class="badge over">Dépassé</span>`;
  if(pct>=80) return `<span class="badge warn">Attention</span>`;
  return `<span class="badge ok">OK</span>`;
}
const dot = c => `<span class="dot" style="background:${c}"></span>`;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}

/* ============================== Rendu : Transactions ============================== */

function renderTx(){
  const months = [...new Set(S.transactions.map(t=>(t.date||"").slice(0,7)))].filter(Boolean).sort().reverse();
  if(!months.includes(UI.month) && UI.month!=="all") months.unshift(UI.month);
  const monthOpts = [`<option value="all"${UI.txMonth==="all"?" selected":""}>Tous les mois</option>`]
    .concat(months.map(k=>`<option value="${k}"${UI.txMonth===k?" selected":""}>${esc(monthLabel(k))}</option>`)).join("");
  const catOpts = [`<option value="all"${UI.txCat==="all"?" selected":""}>Toutes catégories</option>`]
    .concat(cats().map(c=>`<option value="${c.id}"${UI.txCat===c.id?" selected":""}>${esc(c.label)}</option>`)).join("");

  let list = S.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(UI.txMonth!=="all") list = list.filter(t=>(t.date||"").slice(0,7)===UI.txMonth);
  if(UI.txCat!=="all") list = list.filter(t=>t.cat===UI.txCat);

  const total = list.reduce((s,t)=>s+(+t.montant||0),0);
  const rows = list.map(t=>{
    const c = catOf(t.cat);
    const cls = t.cat==="epargne" ? "pos" : "";
    const sign = t.cat==="epargne" ? "+" : "−";
    return `<tr>
      <td class="datecell">${dateLabel(t.date)}</td>
      <td>${esc(t.label)}</td>
      <td><span class="catcell">${dot(c.color)}${esc(c.label)}</span></td>
      <td class="num ${cls}">${sign}&nbsp;${fmt2.format(t.montant)}</td>
      <td class="num"><button class="icon-btn" data-action="del-tx" data-id="${t.id}" title="Supprimer">✕</button></td>
    </tr>`;
  }).join("");

  return `
  <section class="hero">
    <h1><span class="grad-text">Transactions</span> du mois</h1>
    <p class="sub">Saisissez vos dépenses variables et vos virements d'épargne. Les charges fixes récurrentes sont gérées dans Paramètres.</p>
  </section>

  <section class="section">
    <div class="card">
      <form id="quick-add" class="panel" autocomplete="off">
        <label class="field">Date<input type="date" name="date" value="${todayISO()}" required></label>
        <label class="field">Libellé<input type="text" name="libelle" id="tx-label" placeholder="Ex. Supermarché" required></label>
        <label class="field">Montant (€)<input type="text" inputmode="decimal" name="montant" id="tx-amount" placeholder="34,90" required></label>
        <label class="field">Catégorie<select name="cat">${cats().map(c=>`<option value="${c.id}">${esc(c.label)}</option>`).join("")}</select></label>
        <button class="btn btn-grad" type="submit">Ajouter</button>
      </form>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Historique</h2>
      <span class="hint">${list.length} ligne${list.length>1?"s":""} · total ${fmt2.format(total)}</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost btn-sm" data-action="import-open">⬆ Importer un relevé</button>
      <button class="btn btn-ghost btn-sm" data-action="export-csv">Exporter en CSV</button>
    </div>
    <div class="toolbar" style="margin-top:0;margin-bottom:14px">
      <select data-filter="month" style="max-width:220px">${monthOpts}</select>
      <select data-filter="cat" style="max-width:220px">${catOpts}</select>
    </div>
    <input type="file" id="import-bank" accept=".csv,.txt,.ofx,.qfx" style="display:none">
    ${UI.import ? renderImportPanel() : ""}
    <div class="card" style="overflow-x:auto">
      ${list.length ? `<table class="tx-table">
        <thead><tr><th>Date</th><th>Libellé</th><th>Catégorie</th><th style="text-align:right">Montant</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty">Aucune transaction pour ce filtre.</div>`}
    </div>
  </section>`;
}

/* ============================== Rendu : Budget ============================== */

function renderBudget(){
  const m = UI.month;
  const rev = revenuTotal();
  const totalBudgete = chargesTotal() + CATS.reduce((s,c)=>s+budgetOf(c.id),0);

  const bucketCards = BUCKETS.map(b=>{
    const target = partageTarget(b.id);
    const amt = bucketBudget(b.id);
    const pct = rev>0 ? amt/rev*100 : 0;
    const cible = rev*target;
    const delta = amt - cible;
    const note = b.id==="besoins"
      ? (delta>0 ? `dont ${fmt0.format(chargesTotal())} de charges fixes — cible 50 % difficilement tenable, l'essentiel est de protéger l'épargne`
                 : `dont ${fmt0.format(chargesTotal())} de charges fixes`)
      : (delta<0 ? `${fmt0.format(-delta)} de marge sous la cible` : `${fmt0.format(delta)} au-dessus de la cible`);
    return `<div class="card bucket">
      <div class="lbl2">${dot(b.color)}${b.label}
        <span style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)">Cible %
          <input type="text" inputmode="numeric" value="${Math.round(target*100)}" data-partage="${b.id}" style="width:52px;text-align:right;padding:5px 8px">
        </span>
      </div>
      <div class="val2">${fmt0.format(amt)} <span style="font-size:13px;color:var(--muted);font-weight:600">(${Math.round(pct)} % du revenu)</span></div>
      <div class="rec">Cible ${fmt0.format(cible)} — ${note}</div>
      ${b.id==="epargne" ? `<div class="rec" style="color:var(--muted)">💡 Épargné ce mois (réel) : <b style="color:var(--text)">${fmt0.format(savedIn(m))}</b></div>` : ""}
    </div>`;
  }).join("");

  const envelopes = cats().map(c=>{
    const sp = spentByCat(m,c.id), b = budgetOf(c.id), d = dispoOf(c.id,m), ro = d - b;
    const bdg = badgeFor(sp,d);
    return `<div class="card envelope">
      <div class="top">${dot(c.color)}<span class="name">${esc(c.label)}</span>${bdg}${c.custom?`<button class="icon-btn" data-action="del-env" data-id="${c.id}" title="Supprimer l'enveloppe" style="margin-left:${bdg?"8px":"auto"}">✕</button>`:""}</div>
      <div class="mid">${bar(d>0?sp/d*100:0)}</div>
      <div class="bot">
        <span class="nums">Dépensé <b>${fmt0.format(sp)}</b> / ${fmt0.format(d)}${ro!==0?` <span style="color:${ro>0?"var(--green)":"var(--red)"};white-space:nowrap">(dont report ${ro>0?"+":""}${fmt0.format(ro)})</span>`:""} — reste <b>${fmt0.format(Math.max(0,d-sp))}</b></span>
        <label class="field" style="flex-direction:row;align-items:center;gap:8px">Enveloppe
          <input type="text" inputmode="decimal" data-budget="${c.id}" value="${b}">
        </label>
      </div>
    </div>`;
  }).join("");

  return `
  <section class="hero">
    <h1>Budget & <span class="grad-text">enveloppes mensuelles</span></h1>
    <p class="sub">Chaque catégorie a une enveloppe. Quand la barre devient orange (80 %) ou rouge (100 %), il est temps de ralentir ou de réajuster.</p>
    <div class="toolbar">
      <div class="month-nav">
        <button data-action="month-prev" title="Mois précédent">‹</button>
        <b>${esc(monthLabel(m))}</b>
        <button data-action="month-next" title="Mois suivant">›</button>
      </div>
      <span class="spacer"></span>
    </div>
  </section>

  <section class="section">
    <div class="card">
      <div class="gauge-line">
        <span>Total budgété</span><b>${fmt0.format(totalBudgete)} sur ${fmt0.format(rev)} de revenu</b>
      </div>
      ${bar(rev>0?totalBudgete/rev*100:0)}
      <div class="gauge-line">
        <span>${totalBudgete>rev ? "⚠️ Vous avez budgété plus que votre revenu" : "✅ Chaque euro a une destination"}</span>
        <b>${rev>0?Math.round(totalBudgete/rev*100):0} % engagés</b>
      </div>
      <div class="buckets">${bucketCards}</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Enveloppes par catégorie</h2>
      <span class="hint">modifiables — sauvegarde automatique</span>
    </div>
    <div class="grid-cats">${envelopes}</div>
    <div class="card" style="margin-top:14px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
      <label class="field" style="flex:1;min-width:220px">Nouvelle enveloppe personnalisée
        <input id="new-env-name" placeholder="Ex. Voyages, Animaux, Cafés du matin…">
      </label>
      <button class="btn btn-grad" data-action="add-env">＋ Ajouter l'enveloppe</button>
    </div>
  </section>`;
}

/* ============================== Rendu : Plan d'action ============================== */

function renderPlan(){
  const m = monthKey(new Date());
  const rev = revenuTotal(), obj = S.settings.objectif, chg = chargesTotal();
  const objPct = rev>0 ? obj/rev*100 : 0;
  const apresEpargne = rev - chg - obj;

  const varTx = txIn(m).filter(t=>t.cat!=="epargne");
  const topCats = cats().filter(c=>c.id!=="epargne")
    .map(c=>({c, v:spentByCat(m,c.id)}))
    .filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,2)
    .map(x=>`${x.c.label} (${fmt0.format(x.v)})`).join(", ") || "—";

  const proj3 = projection(3,obj), proj6 = projection(6,obj), proj12 = projection(12,obj);

  const step = (num, when, title, chips, body, checks) => `
    <div class="card plan-step">
      <div class="stepnum">${num}</div>
      <h3>${title}<span class="when">${when}</span></h3>
      <div class="chips">${chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>
      ${body?`<p class="body">${body}</p>`:""}
      <div class="checks">${checks.map(id=>`
        <label class="${S.plan[id]?"done":""}">
          <input type="checkbox" data-check="${id}" ${S.plan[id]?"checked":""}>
          <span>${CHECK_LABELS[id]}</span>
        </label>`).join("")}
      </div>
    </div>`;

  const done = Object.values(S.plan).filter(Boolean).length;
  const totalChecks = Object.keys(CHECK_LABELS).length;

  return `
  <section class="hero">
    <h1>Plan d'action — <span class="grad-text">3 étapes chiffrées</span></h1>
    <p class="sub">Objectif actuel : <b>économiser ${fmt0.format(obj)} de plus par mois</b> (${Math.round(objPct)} % du revenu). Les chiffres se recalculent depuis vos Paramètres.</p>
    <div class="toolbar">
      <div class="chip">Progression&nbsp;<b>${done}/${totalChecks}</b>&nbsp;actions validées</div>
      <div style="width:220px">${bar(totalChecks?done/totalChecks*100:0)}</div>
    </div>
  </section>

  <section class="section" style="display:flex;flex-direction:column;gap:16px">
    ${step(1, "Semaine 1", "Cartographier & couper l'inutile",
      [
        `Charges fixes : <b>${fmt0.format(chg)}</b> (${rev>0?Math.round(chg/rev*100):0} % du revenu)`,
        `Postes variables n°1 : <b>${topCats}</b>`,
        `Potentiel de coupe : <b>25 à 40 €/mois</b>`,
      ],
      `Résiliez 1 à 2 abonnements peu utilisés (streaming, salle de sport, forfait) et renégociez mobile, assurance ou énergie. Chaque 30 € récupérés par mois, c'est <b>360 €/an</b> de capacité d'épargne en plus — transférés directement dans l'objectif.`,
      ["c1","c2","c3"])}

    ${step(2, "Semaine 2", "Automatiser l'épargne (pay yourself first)",
      [
        `Virement permanent : <b>${fmt0.format(obj)}</b>`,
        `Jour conseillé : le <b>${S.settings.jourPaie} du mois</b> (jour de paie)`,
        `Placement : Livret A / LDDS (~2,4 %)`,
      ],
      `L'épargne passe en premier : le virement part le jour de paie vers un compte séparé, il reste alors <b>${fmt0.format(Math.max(0,apresEpargne))}</b> à répartir pour le mois. Un compte distinct « intouchable » réduit fortement les tentations.`,
      ["c4","c5","c6"])}

    ${step(3, "En continu", "Piloter 10 minutes par semaine",
      [
        `Rituel : <b>10 min chaque dimanche</b>`,
        `Alerte : <b>80 %</b> de l'enveloppe`,
        `Réajustement : le <b>1ᵉʳ du mois</b>`,
      ],
      `Ouvrez le Tableau de bord, vérifiez les alertes 80 %/100 % et notez les dépenses à venir de la semaine. Enveloppe hebdomadaire indicative : <b>${fmt0.format(Math.max(0,apresEpargne)/4.33)}</b> (reste à vivre hors épargne ÷ 4,33). Le 1ᵉʳ du mois, réajustez les enveloppes depuis l'onglet Budget.`,
      ["c7","c8","c9"])}
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Projection de votre épargne</h2>
      <span class="hint">${fmt0.format(obj)}/mois placés à 2,4 % (taux indicatif)</span>
    </div>
    <div class="kpis">
      ${[[ "Dans 3 mois", proj3],[ "Dans 6 mois", proj6],[ "Dans 12 mois", proj12]].map(([l,v])=>`
        <div class="card kpi">
          <div class="lbl">${l}</div>
          <div class="val pos">${fmt0.format(v)}</div>
          <div class="sub">dont ~${fmt0.format(v - obj*({"Dans 3 mois":3,"Dans 6 mois":6,"Dans 12 mois":12}[l]))} d'intérêts</div>
        </div>`).join("")}
    </div>
  </section>`;
}

function renderImportPanel(){
  const imp = UI.import;

  const shown = rows.slice(0,200);
  const colOpts = sel => imp.header.map((h,i)=>`<option value="${i}"${sel===i?" selected":""}>${esc(h||("Colonne "+(i+1)))}</option>`).join("");
  const creditOpts = `<option value="-1"${imp.map.credit<0?" selected":""}>— aucune —</option>` + colOpts(imp.map.credit);
  const catOpts = sel => [`<option value="__ignore__"${sel==="__ignore__"?" selected":""}>— Ignorer —</option>`]
    .concat(cats().map(c=>`<option value="${c.id}"${sel===c.id?" selected":""}>${esc(c.label)}</option>`)).join("");
  const body = shown.map(r=>{
    const badge = r.dup ? `<span class="badge warn">déjà présent</span>`
      : !r.valid ? `<span class="badge over">illisible</span>`
      : r.cat==="__ignore__" ? `<span class="badge ok">ignoré</span>` : "";
    return `<tr style="${r.dup||!r.valid?"opacity:.55":""}">
      <td class="datecell">${r.date?dateLabel(r.date):"?"}</td>
      <td>${esc(r.label)}</td>

      <td><select data-icat="${r.idx}" style="padding:6px 8px;font-size:13px">${catOpts(r.cat)}</select></td>
      <td>${badge}</td>
    </tr>`;
  }).join("");
  return `
  <div class="card" style="margin-bottom:14px;border-color:#3a3a52">
    <div class="row1"><span class="name" style="font-weight:800;font-size:15px">⬆ Aperçu de l'import — ${esc(imp.fileName)}</span></div>
    <p style="color:var(--muted);font-size:12.5px;margin:8px 0 12px">Vérifiez les colonnes détectées, ajustez si besoin les catégories, puis validez. Les lignes correspondant à vos charges fixes (déjà comptées) et les doublons sont ignorées automatiquement.</p>
    <div class="row" style="flex-wrap:wrap;gap:10px">

      <label class="field" style="flex:1;min-width:180px">Colonne Libellé<select data-imap="label">${colOpts(imp.map.label)}</select></label>
      <label class="field" style="width:150px">Colonne Montant<select data-imap="montant">${colOpts(imp.map.montant)}</select></label>
      <label class="field" style="width:170px">Colonne Crédit (revenus)<select data-imap="credit">${creditOpts}</select></label>
    </div>
    <div style="overflow-x:auto;max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-top:6px">
      <table class="tx-table">
        <thead><tr><th>Date</th><th>Libellé</th><th style="text-align:right">Montant</th><th>Catégorie</th><th></th></tr></thead>
        <tbody>${body || `<tr><td colspan="5" class="empty">Aucune ligne.</td></tr>`}</tbody>
      </table>
    </div>
    <div class="total-line" id="import-counts">${importCountsHtml(rows)}</div>
    ${rows.length>200?`<p style="color:var(--muted-2);font-size:12px;margin-top:8px">…et ${rows.length-200} autres lignes (toutes importées avec la catégorisation automatique).</p>`:""}
    <div class="row" style="gap:10px;margin-top:12px">
      <button class="btn btn-grad" data-action="import-confirm">✓ Importer</button>
      <button class="btn btn-ghost" data-action="import-cancel">Annuler</button>
    </div>
  </div>`;
}

/* ============================== Rendu global ============================== */

function monthsUntil(fromM, toM){
  let n = 0, cur = fromM;
  while(cur < toM && n < 600){ cur = shiftMonth(cur,1); n++; }
  return n;
}

/* ============================== Rendu : Bilan mensuel ============================== */

const shortMonth = key => {
  const [y,m] = key.split("-").map(Number);
  const s = new Date(y, m-1, 1).toLocaleDateString("fr-FR",{month:"short"});
  return s.charAt(0).toUpperCase()+s.slice(1).replace(".","");
};
const axisFmt = v => v>=1000 ? (Math.round(v/100)/10).toLocaleString("fr-FR")+" k€" : Math.round(v)+" €";
function niceMax(v){
  if(v<=0) return 100;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const k of [1, 2, 2.5, 5, 10]) if(k*p >= v) return k*p;
  return 10*p;
}
function lastNMonths(m, n){
  const arr = []; for(let i=n-1;i>=0;i--) arr.push(shiftMonth(m,-i)); return arr;
}
function trackedMonthsUpTo(m, cap=240){
  const start = firstTrackedMonth();
  const arr = [];
  let cur = start;
  while(cur <= m && arr.length < cap){ arr.push(cur); cur = shiftMonth(cur,1); }
  return arr;
}

function chartDepenses(m, n){
  const months = lastNMonths(m, n);
  const varCats = cats().filter(c=>c.id!=="epargne");
  const totals = months.map(mo => varCats.reduce((s,c)=>s+spentByCat(mo,c.id),0));
  const max = niceMax(Math.max(...totals, 100));
  const W = n>12 ? 1280 : (n>6 ? 960 : 720), H=250, L=52, R=8, T=14, B=26, plotW=W-L-R, plotH=H-T-B;
  const col = plotW/n, barW = Math.min(64, col*0.62);
  let out = "";
  for(let g=0; g<=4; g++){
    const v = max*g/4, y = (T+plotH - v/max*plotH).toFixed(1);
    out += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" style="stroke:var(--chart-grid)"/>` +
           `<text x="${L-8}" y="${+y+3.5}" text-anchor="end" font-size="10" style="fill:var(--muted-2)">${axisFmt(v)}</text>`;
  }
  months.forEach((mo,i)=>{
    let y0 = T+plotH;
    const x = (L + col*i + (col-barW)/2).toFixed(1);
    for(const c of varCats){
      const v = spentByCat(mo,c.id); if(v<=0) continue;
      const h = Math.max(1.5, v/max*plotH);
      out += `<g><title>${esc(c.label)} — ${esc(monthLabel(mo))} : ${fmt0.format(v)}</title>` +
             `<rect x="${x}" y="${(y0-h).toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" fill="${c.color}" opacity=".9"/></g>`;
      y0 -= h;
    }
    const tot = totals[i];
    if(tot>0) out += `<text x="${L+col*i+col/2}" y="${(y0-6).toFixed(1)}" text-anchor="middle" font-size="${n>12?10:11}" font-weight="700" style="fill:var(--text)">${fmt0.format(tot)}</text>`;
    out += `<text x="${L+col*i+col/2}" y="${H-8}" text-anchor="middle" font-size="${n>12?9.5:(n>6?10:11.5)}" style="fill:var(--muted)">${esc(shortMonth(mo))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Dépenses variables par mois">${out}</svg>`;
}

function chartEpargne(m, cap){
  const months = trackedMonthsUpTo(m, cap);
  if(!months.length) return `<div class="empty">Aucun mois suivi avant ${esc(monthLabel(m))}.</div>`;
  const vals = []; let cum = 0;
  for(const mo of months){ cum += savedIn(mo); vals.push(cum); }
  const max = niceMax(Math.max(...vals, 100));
  const W = cap>12 ? 1280 : (cap>6 ? 960 : 720), H=200, L=52, R=14, T=14, B=26, plotW=W-L-R, plotH=H-T-B;
  const X = i => months.length===1 ? L+plotW/2 : L + plotW*i/(months.length-1);
  const Y = v => T+plotH - v/max*plotH;
  let out = `<defs><linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1">` +
            `<stop offset="0" stop-color="#8b5cf6" stop-opacity=".32"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs>`;
  for(let g=0; g<=4; g++){
    const v = max*g/4, y = Y(v).toFixed(1);
    out += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" style="stroke:var(--chart-grid)"/>` +
           `<text x="${L-8}" y="${+y+3.5}" text-anchor="end" font-size="10" style="fill:var(--muted-2)">${axisFmt(v)}</text>`;
  }
  const pts = vals.map((v,i)=>[X(i), Y(v)]);
  if(months.length>1){
    const line = pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ");
    out += `<path d="M ${pts.map(p=>p[0].toFixed(1)).join(" L ")} L ${pts[pts.length-1][0].toFixed(1)} ${(T+plotH).toFixed(1)} L ${pts[0][0].toFixed(1)} ${(T+plotH).toFixed(1)} Z" fill="url(#gradArea)"/>` +
           `<polyline points="${line}" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  pts.forEach((p,i)=>{
    const last = i===pts.length-1;
    out += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4.5:3}" fill="${last?"#c084fc":"#a78bfa"}"><title>${esc(monthLabel(months[i]))} : ${fmt0.format(vals[i])} cumulés</title></circle>`;
    if(last) out += `<text x="${Math.min(p[0], W-R-2)}" y="${(p[1]-11).toFixed(1)}" text-anchor="end" font-size="12" font-weight="800" fill="#c084fc">${fmt0.format(vals[i])}</text>`;
    if(months.length<=6 || i%2===0 || last)
      out += `<text x="${p[0].toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(shortMonth(months[i]))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Épargne cumulée">${out}</svg>`;
}

function renderBilan(){
  const m = UI.month;
  const varCats = cats().filter(c=>c.id!=="epargne");
  const months = trackedMonthsUpTo(m);
  const nM = months.length;
  const epCumulee = months.reduce((s,mo)=>s+savedIn(mo),0);
  const epMoy = nM ? epCumulee/nM : 0;
  const sixM = lastNMonths(m, UI.period);
  const sixAvecTx = sixM.filter(mo => txIn(mo).some(t=>t.cat!=="epargne"));
  const depMoy = sixAvecTx.length ? sixAvecTx.reduce((s,mo)=>s+spentVar(mo),0)/sixAvecTx.length : 0;
  const taux = (nM && revenuTotal()>0) ? epCumulee/(revenuTotal()*nM)*100 : 0;

  // Bilan du mois vs moyenne des 3 mois précédents
  const prev3 = lastNMonths(shiftMonth(m,-1), 3);
  const avgOf = id => {
    const h = prev3.map(p=>spentByCat(p,id));
    return h.some(v=>v>0) ? h.reduce((s,v)=>s+v,0)/3 : null;
  };
  const totNow = varCats.reduce((s,c)=>s+spentByCat(m,c.id),0);
  const avgs = varCats.map(c=>avgOf(c.id));
  const totAvg = avgs.some(a=>a===null) && avgs.every(a=>a===null) ? null : varCats.reduce((s,_,i)=>s+(avgs[i]||0),0);
  const bilanPhrase = totAvg===null ? `Pas encore d'historique : la comparaison s'activera dès que vous aurez des dépenses sur au moins un des 3 mois précédents.`
    : (() => {
      const d = totNow - totAvg;
      if(Math.abs(d) < 1) return `Votre mois est <b>stable</b> par rapport à votre moyenne des 3 derniers mois.`;
      const pct = totAvg>0 ? Math.round(Math.abs(d)/totAvg*100) : 100;
      return d<0 ? `Bon mois : vous dépensez <b class="pos">${fmt0.format(Math.abs(d))} de moins</b> que votre moyenne des 3 derniers mois (${pct} %).`
                 : `Attention : vous dépensez déjà <b class="neg">${fmt0.format(d)} de plus</b> que votre moyenne des 3 derniers mois (${pct} %).`;
    })();

  // Année sur année : même mois, un an d'écart
  const lastYearM = shiftMonth(m,-12);
  const nowVar = spentVar(m);
  const lastYearVar = spentVar(lastYearM);
  const hasLastYear = txIn(lastYearM).some(t=>t.cat!=="epargne");
  const dYoY = nowVar - lastYearVar;
  const pctYoY = lastYearVar>0 ? Math.round(Math.abs(dYoY)/lastYearVar*100) : null;

  const rows = cats().map(c=>{
    const now = spentByCat(m,c.id);
    const avg = avgOf(c.id);
    let ecart;
    if(avg===null) ecart = `<span style="color:var(--muted-2)">—</span>`;
    else{
      const d = now - avg;
      const isEp = c.id==="epargne";
      if(Math.abs(d) < 1) ecart = `<span style="color:var(--muted-2)">≈ stable</span>`;
      else{
        const pct = avg>0 ? Math.round(Math.abs(d)/avg*100) : 100;
        const up = d>0;
        const color = isEp ? (up?"var(--green)":"var(--red)") : (up?"var(--red)":"var(--green)");
        ecart = `<span style="color:${color};font-weight:700">${up?"↑":"↓"} ${up?"+":"−"}${fmt0.format(Math.abs(d))} (${up?"+":"−"}${pct} %)</span>`;
      }
    }
    return `<tr>
      <td><span class="catcell">${dot(c.color)}${esc(c.label)}</span></td>
      <td class="num">${fmt2.format(now)}</td>
      <td class="num" style="color:var(--muted)">${avg===null?"—":fmt2.format(avg)}</td>
      <td class="num">${ecart}</td>
    </tr>`;
  }).join("");

  const legend = varCats.map(c=>`<span class="chip">${dot(c.color)}${esc(c.label)}</span>`).join("");

  return `
  <section class="hero">
    <h1>Bilan & <span class="grad-text">tendances</span></h1>
    <p class="sub">Vos habitudes en un coup d'œil : dépenses par catégorie, épargne cumulée et comparaison du mois en cours à votre moyenne. Mois affiché : <b>${esc(monthLabel(m))}</b>.</p>
    <div class="toolbar">
      <div class="month-nav">
        <button data-action="month-prev" title="Mois précédent">‹</button>
        <b>${esc(monthLabel(m))}</b>
        <button data-action="month-next" title="Mois suivant">›</button>
      </div>
      <div class="month-nav" title="Période des graphiques">
        <button data-action="period" data-n="3" class="${UI.period===3?"on":""}">3 mois</button>
        <button data-action="period" data-n="6" class="${UI.period===6?"on":""}">6 mois</button>
        <button data-action="period" data-n="12" class="${UI.period===12?"on":""}">12 mois</button>
        <button data-action="period" data-n="24" class="${UI.period===24?"on":""}">24 mois</button>
      </div>
    </div>
  </section>

  <section class="kpis section">
    <div class="card kpi">
      <div class="lbl">Épargne cumulée</div>
      <div class="val pos">${fmt0.format(epCumulee)}</div>
      <div class="sub">depuis ${nM>1?esc(monthLabel(months[0])):"ce mois"} (${nM} mois)</div>
    </div>
    <div class="card kpi">
      <div class="lbl">Épargne moyenne</div>
      <div class="val">${fmt0.format(epMoy)}</div>
      <div class="sub">par mois · objectif ${fmt0.format(S.settings.objectif)}</div>
    </div>
    <div class="card kpi">
      <div class="lbl">Dépenses variables moyennes</div>
      <div class="val">${fmt0.format(depMoy)}</div>
      <div class="sub">par mois (${UI.period} derniers mois actifs)</div>
    </div>
    <div class="card kpi">
      <div class="lbl">Taux d'épargne moyen</div>
      <div class="val ${taux>=20?"pos":taux<10?"neg":""}">${Math.round(taux)} %</div>
      <div class="sub">cible conseillée : 20 %</div>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Dépenses variables — ${UI.period} derniers mois</h2>
      <span class="hint">le mois en cours est peut-être partiel</span>
    </div>
    <div class="card">${chartDepenses(m, UI.period)}<div class="chips" style="margin-top:12px">${legend}</div></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Épargne cumulée</h2>
      <span class="hint">somme mise de côté, mois après mois (jusqu'à ${UI.period} mois)</span>
    </div>
    <div class="card">${chartEpargne(m, UI.period)}</div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Ce mois vs moyenne des 3 mois précédents</h2>
      <button class="btn btn-ghost btn-sm" data-action="print-bilan">${estPlus()?"🖨 Exporter en PDF":"🔒 Exporter en PDF (Plus)"}</button>
    </div>
    <div class="card" style="margin-bottom:14px">${bilanPhrase}</div>
    <div class="card" style="overflow-x:auto">
      <table class="tx-table">
        <thead><tr><th>Catégorie</th><th style="text-align:right">Ce mois</th><th style="text-align:right">Moy. 3 mois</th><th style="text-align:right">Écart</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>Année sur année</h2>
      <span class="hint">même mois, un an d'écart</span>
    </div>
    <div class="kpis">
      <div class="card kpi">
        <div class="lbl">${esc(monthLabel(m))}</div>
        <div class="val">${fmt0.format(nowVar)}</div>
        <div class="sub">dépenses variables du mois</div>
      </div>
      <div class="card kpi">
        <div class="lbl">${esc(monthLabel(lastYearM))}</div>
        <div class="val">${hasLastYear?fmt0.format(lastYearVar):"—"}</div>
        <div class="sub">${hasLastYear?"à la même période l'an dernier":"pas encore de données ce mois-là"}</div>
      </div>
      <div class="card kpi">
        <div class="lbl">Écart</div>
        ${hasLastYear
          ? (Math.abs(dYoY)<1
              ? `<div class="val">≈ stable</div><div class="sub">comme l'an dernier à la même période</div>`
              : `<div class="val ${dYoY<=0?"pos":"neg"}">${dYoY>0?"+":"−"}${fmt0.format(Math.abs(dYoY))}</div><div class="sub">${dYoY>0?"plus":"moins"} qu'il y a un an${pctYoY!==null?" ("+pctYoY+" %)":""}</div>`)
          : `<div class="val">—</div><div class="sub">visible dès que vous aurez un an d'historique</div>`}
      </div>
    </div>
  </section>`;
}

/* ============================== Rendu : Projection fin de mois ============================== */

function renderProjection(m){
  const today = new Date();
  const cm = monthKey(today);
  if(m !== cm) return ""; // projection uniquement pour le mois en cours
  const day = today.getDate();
  const dim = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();
  const varCats = cats().filter(c=>c.id!=="epargne");
  const spentTotal = varCats.reduce((s,c)=>s+spentByCat(m,c.id),0);
  if(spentTotal<=0 || day<1) return "";
  const pace = spentTotal/day;
  const projTotal = pace*dim;
  const budgetTotal = varCats.reduce((s,c)=>s+budgetOf(c.id),0);
  const over = [];
  for(const c of varCats){
    const sp = spentByCat(m,c.id);
    if(sp<=0) continue;
    const p = sp/day*dim, b = budgetOf(c.id);
    if(b>0 && p>b){
      const jour = Math.min(dim, Math.ceil(b/(sp/day)));
      over.push(`<b>${esc(c.label)}</b> : dépassé vers le <b>${jour}</b> (proj. ${fmt0.format(p)} / ${fmt0.format(b)})`);
    } else if(b===0){
      over.push(`<b>${esc(c.label)}</b> : pas d'enveloppe définie (proj. ${fmt0.format(p)})`);
    }
  }
  const diff = projTotal - budgetTotal;
  const main = budgetTotal>0
    ? (diff>0
        ? `À ce rythme (~${fmt0.format(pace)}/jour), vous terminerez le mois à <b class="neg">${fmt0.format(projTotal)}</b> de dépenses variables — soit ${fmt0.format(diff)} au-dessus de vos enveloppes (${fmt0.format(budgetTotal)}).`
        : `À ce rythme (~${fmt0.format(pace)}/jour), vous terminerez le mois à <b class="pos">${fmt0.format(projTotal)}</b> de dépenses variables — dans votre enveloppe globale de ${fmt0.format(budgetTotal)}.`)
    : `À ce rythme (~${fmt0.format(pace)}/jour), vous terminerez le mois à <b>${fmt0.format(projTotal)}</b> de dépenses variables. Définissez vos enveloppes dans l'onglet Budget.`;
  const couleur = (diff>0 || over.length) ? "rgba(251,191,36,.35)" : "rgba(52,211,153,.35)";
  return `<section style="margin-top:16px" class="proj">
    <div class="card" style="border-color:${couleur}">
      <div class="row1"><span class="name" style="font-weight:800;font-size:15px">📈 Projection fin de mois</span><span class="hint" style="margin-left:auto">hypothèse : cadence constante — ${day} jour${day>1?"s":""} écoulé${day>1?"s":""} sur ${dim}</span></div>
      <p style="margin-top:10px;font-size:14px">${main}</p>
      ${over.length?`<div class="chips" style="margin-top:10px">${over.map(o=>`<span class="chip">${o}</span>`).join("")}</div>`:`<div class="chips" style="margin-top:10px"><span class="chip">✅ Toutes les enveloppes sont sur la bonne trajectoire</span></div>`}
    </div>
  </section>`;
}

function statsFor(st, month){
  const rev = (st.settings.revenus||[]).reduce((s,r)=>s+(+r.montant||0),0);
  const chg = (st.settings.chargesFixes||[]).reduce((s,c)=>s+(+c.montant||0),0);
  const byCat = {};
  for(const t of (st.transactions||[])){
    if((t.date||"").slice(0,7) !== month) continue;
    byCat[t.cat] = (byCat[t.cat]||0) + (+t.montant||0);
  }
  const ep = byCat["epargne"]||0;
  let varTot = 0;
  for(const k in byCat) if(k!=="epargne") varTot += byCat[k];
  return {rev, chg, byCat, ep, varTot, rav: rev - chg - varTot};
}
